<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haluski: Misión a la Base</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; color: #dfe9ff; font-family: "Trebuchet MS", Verdana, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #caja { position: relative; aspect-ratio: 4 / 3; width: min(800px, 100vw, calc(84vh * 4 / 3)); border: 2px solid #2b3a7a; border-radius: 6px; box-shadow: 0 0 30px #1b2a7a88; overflow: hidden; background: #070a1c; }
  #caja canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #ayuda { margin-top: 8px; font-size: 14px; color: #8fa3d9; text-align: center; padding: 0 8px; line-height: 1.7; }
  kbd { background: #1a2350; border: 1px solid #3a4a94; border-radius: 4px; padding: 1px 6px; color: #fff; }
</style>
</head>
<body>
<div id="caja"><canvas id="escena" width="800" height="600"></canvas><canvas id="juego" width="800" height="600"></canvas></div>
<div id="ayuda">
  <b>1 jugador:</b> <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> o <kbd>WASD</kbd> mover · <kbd>Espacio</kbd> disparar<br>
  <b>2 jugadores:</b> J1 <kbd>WASD</kbd> + <kbd>Espacio</kbd> · J2 <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> + <kbd>Enter</kbd><br>
  <kbd>P</kbd> pausa · <kbd>M</kbd> sonido
</div>
<script src="three.min.js"></script>
<script>
(() => {
"use strict";
const cv = document.getElementById("juego");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const TOTAL_NIVELES = 10;

// ---------- Entrada ----------
const teclas = {};
const pulsada = {};
addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  if (!teclas[e.code]) pulsada[e.code] = true;
  teclas[e.code] = true;
  initAudio();
});
addEventListener("keyup", e => { teclas[e.code] = false; });
const hit = c => !!pulsada[c];

const MAPAS = {
  solo:    { izq: ["KeyA", "ArrowLeft"], der: ["KeyD", "ArrowRight"], arr: ["KeyW", "ArrowUp"], abj: ["KeyS", "ArrowDown"], disp: ["Space"] },
  wasd:    { izq: ["KeyA"], der: ["KeyD"], arr: ["KeyW"], abj: ["KeyS"], disp: ["Space"] },
  flechas: { izq: ["ArrowLeft"], der: ["ArrowRight"], arr: ["ArrowUp"], abj: ["ArrowDown"], disp: ["Enter"] },
};
const activo = (p, a) => p.mapa[a].some(c => teclas[c]);

// ---------- Sonido ----------
let actx = null, sonido = true;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
}
function beep(f1, f2, dur, tipo = "square", vol = 0.06) {
  if (!actx || !sonido) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = tipo;
  o.frequency.setValueAtTime(f1, actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), actx.currentTime + dur);
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}
const sfx = {
  disparo: () => beep(900, 300, 0.1, "square", 0.03),
  explosion: () => beep(220, 40, 0.3, "sawtooth", 0.07),
  golpe: () => beep(300, 60, 0.35, "sawtooth", 0.09),
  bonus: () => { beep(500, 900, 0.12, "triangle", 0.08); setTimeout(() => beep(900, 1400, 0.12, "triangle", 0.08), 90); },
  nivel: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, f, 0.18, "triangle", 0.08), i * 120)),
  derrota: () => [400, 300, 200, 100].forEach((f, i) => setTimeout(() => beep(f, f * 0.7, 0.25, "sawtooth", 0.08), i * 160)),
};

// ---------- Utilidades ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const choque = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r;
function texto(t, x, y, tam, color = "#fff", align = "center", sombra = true) {
  ctx.font = `bold ${tam}px "Trebuchet MS", Verdana, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = "middle";
  if (sombra) { ctx.fillStyle = "#000a"; ctx.fillText(t, x + 2, y + 2); }
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}

// ---------- Niveles ----------
function configNivel(n) {
  const k = numJugadores === 2 ? 0.8 : 1; // con dos naves aparece más enemigo
  return {
    nombre: ["Órbita Terrestre","Cinturón Lunar","Nube de Polvo","Campo de Asteroides","Tormenta Solar",
             "Nebulosa Carmesí","Zona Hostil","Cementerio Estelar","Agujero Negro","La Base Final"][n - 1],
    duracion: 28 + n * 4,
    spawnEnemigo: Math.max(0.55, 1.6 - n * 0.1) * k,
    spawnMeteoro: Math.max(0.35, 1.3 - n * 0.09) * k,
    velEnemigo: 70 + n * 9,
    velMeteoro: 110 + n * 14,
    probTirador: Math.min(0.75, 0.1 + n * 0.07),
    probZigzag: n >= 3 ? Math.min(0.5, 0.1 + (n - 3) * 0.06) : 0,
    jefe: n === 5 || n === 10,
  };
}

// ---------- Estado ----------
let estado = "menu"; // menu, intro, jugando, pausa, jefe, aterrizando, nivelCompleto, derrota, victoria
let estadoPrevio = "jugando";
let numJugadores = 1;
let nivel = 1, cfg, t = 0, progreso = 0, record = 0;
try { record = +localStorage.getItem("haluski_record") || 0; } catch (e) {}
let jugadores = [], balas, enemigos, meteoros, balasEnemigas, particulas, bonus, base, jefe;
let temporizadorIntro = 0, spawnE = 0, spawnM = 0, sacudida = 0, ultimoBono = 0;

const NOMBRES = ["Haluski", "Jugador 2"];
const COLORES = ["#4cc9f0", "#ff9f43"];

function crearJugadores(n) {
  return Array.from({ length: n }, (_, i) => ({
    id: i, nombre: NOMBRES[i], color: COLORES[i],
    mapa: n === 1 ? MAPAS.solo : (i === 0 ? MAPAS.wasd : MAPAS.flechas),
    spawnX: n === 1 ? W / 2 : W / 2 + (i === 0 ? -90 : 90),
    x: 0, y: H - 80, r: 16, vel: 300, vidas: 3, escudo: 0, invul: 0, cool: 0, doble: 0,
    vivo: true, puntos: 0, aterrizado: false,
  }));
}
const vivos = () => jugadores.filter(p => p.vivo);
const totalPuntos = () => jugadores.reduce((s, p) => s + p.puntos, 0);
function sumar(p, n) { if (p) p.puntos += n; else jugadores[0].puntos += n; }
function guardarRecord() {
  const total = totalPuntos();
  if (total > record) { record = total; try { localStorage.setItem("haluski_record", record); } catch (e) {} }
}
function objetivo(x, y) {
  let mejor = null, d = Infinity;
  for (const p of vivos()) { const dd = Math.hypot(p.x - x, p.y - y); if (dd < d) { d = dd; mejor = p; } }
  return mejor;
}

function prepararMenu() {
  jugadores = crearJugadores(numJugadores);
  jugadores.forEach((p, i) => { p.x = W / 2 + (numJugadores === 1 ? 0 : (i ? 60 : -60)); p.y = 235; p.invul = 0; });
  balas = []; enemigos = []; meteoros = []; balasEnemigas = []; particulas = []; bonus = []; base = null; jefe = null; nivel = 1; progreso = 0;
}
function iniciarJuego() {
  nivel = 1; jugadores = crearJugadores(numJugadores);
  empezarNivel();
}
function empezarNivel() {
  cfg = configNivel(nivel);
  balas = []; enemigos = []; meteoros = []; balasEnemigas = []; particulas = []; bonus = [];
  base = null; jefe = null; progreso = 0; spawnE = 1; spawnM = 0.5;
  for (const p of jugadores) {
    if (!p.vivo) { p.vivo = true; p.vidas = 1; } // los caídos vuelven con 1 vida
    p.x = p.spawnX; p.y = H - 80; p.invul = 2; p.cool = 0; p.aterrizado = false;
  }
  temporizadorIntro = 2.6; estado = "intro";
}

// ---------- Efectos ----------
function explosion(x, y, n = 16, color = "#ffb347", vel = 180) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.283), v = rnd(30, vel);
    particulas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vida: rnd(0.3, 0.8), max: 0.8, color, tam: rnd(1.5, 4) });
  }
}

// ---------- Creación ----------
function crearEnemigo() {
  const r = Math.random();
  let tipo = "explorador";
  if (r < cfg.probZigzag) tipo = "zigzag";
  else if (r < cfg.probZigzag + cfg.probTirador) tipo = "tirador";
  const e = { tipo, x: rnd(40, W - 40), y: -30, r: 18, vida: 1, base: 0, fase: rnd(0, 6.28), cool: rnd(0.8, 2) };
  e.base = e.x;
  if (tipo === "tirador") { e.vida = 2 + (nivel > 6 ? 1 : 0); e.r = 20; }
  enemigos.push(e);
}
function crearMeteoro() {
  const r = rnd(16, 34);
  meteoros.push({ x: rnd(r, W - r), y: -r, r, vx: rnd(-40, 40), vy: cfg.velMeteoro * rnd(0.8, 1.3), rot: rnd(0, 6), vrot: rnd(-2, 2),
    forma: Array.from({ length: 9 }, () => rnd(0.75, 1.1)) });
}
function crearJefe() {
  const gran = nivel === 10;
  const vida = Math.round((gran ? 60 : 25) * (numJugadores === 2 ? 1.6 : 1));
  jefe = { x: W / 2, y: -80, r: gran ? 55 : 42, vida, max: vida, dir: 1, cool: 1.5, fase: 0, entrando: true, gran };
  estado = "jefe";
}
function soltarBonus(x, y) {
  if (Math.random() > 0.17) return;
  const todosLlenos = vivos().every(p => p.vidas >= 5) && vivos().length === jugadores.length;
  const tipos = todosLlenos ? ["escudo", "doble"] : ["escudo", "doble", "vida"];
  bonus.push({ x, y, r: 13, tipo: tipos[rint(0, tipos.length - 1)] });
}
function dispararEnemigo(x, y, tx, ty, vel = 220) {
  const a = Math.atan2(ty - y, tx - x);
  balasEnemigas.push({ x, y, vx: Math.cos(a) * vel, vy: Math.sin(a) * vel, r: 5 });
}

// ---------- Daño ----------
function dañarJugador(p) {
  if (p.invul > 0 || !p.vivo || p.aterrizado) return;
  if (p.escudo > 0) { p.escudo = 0; p.invul = 1; sfx.golpe(); explosion(p.x, p.y, 10, "#6cf"); return; }
  p.vidas--; sacudida = 0.4; sfx.golpe();
  explosion(p.x, p.y, 24, "#ff6a4d");
  p.doble = 0;
  if (p.vidas <= 0) {
    p.vivo = false;
    if (!vivos().length) { estado = "derrota"; sfx.derrota(); guardarRecord(); }
  } else { p.invul = 2.2; p.x = p.spawnX; p.y = H - 80; }
}

// ---------- Actualización ----------
function actualizar(dt) {
  t += dt;
  const enAccion = estado === "jugando" || estado === "jefe";
  if (sacudida > 0) sacudida -= dt;

  if (estado === "menu") {
    const antes = numJugadores;
    if (hit("Digit1") || hit("Numpad1") || hit("ArrowLeft")) numJugadores = 1;
    if (hit("Digit2") || hit("Numpad2") || hit("ArrowRight")) numJugadores = 2;
    if (numJugadores !== antes) prepararMenu();
    if (hit("Enter") || hit("Space")) iniciarJuego();
    return;
  }
  if (estado === "derrota" || estado === "victoria") { if (hit("Enter")) { estado = "menu"; prepararMenu(); } return; }
  if (estado === "pausa") { if (hit("KeyP")) estado = estadoPrevio; return; }
  if (estado === "nivelCompleto") {
    temporizadorIntro -= dt;
    if (temporizadorIntro <= 0 || hit("Enter")) {
      if (nivel >= TOTAL_NIVELES) { estado = "victoria"; guardarRecord(); }
      else { nivel++; empezarNivel(); }
    }
    return;
  }
  if (estado === "intro") {
    temporizadorIntro -= dt;
    if (temporizadorIntro <= 0) estado = "jugando";
    for (const p of jugadores) moverJugador(p, dt);
    actualizarParticulas(dt);
    return;
  }
  if (hit("KeyP")) { estadoPrevio = estado; estado = "pausa"; return; }

  for (const p of jugadores) {
    moverJugador(p, dt);
    // Disparo
    p.cool -= dt;
    if (p.vivo && !p.aterrizado && estado !== "aterrizando" && activo(p, "disp") && p.cool <= 0) {
      p.cool = 0.2;
      if (p.doble > 0) balas.push({ x: p.x - 10, y: p.y - 14, r: 3, dueño: p }, { x: p.x + 10, y: p.y - 14, r: 3, dueño: p });
      else balas.push({ x: p.x, y: p.y - 18, r: 3, dueño: p });
      sfx.disparo();
    }
    if (p.doble > 0) p.doble -= dt;
    if (p.invul > 0) p.invul -= dt;
  }

  // Avance del nivel
  if (estado === "jugando") {
    progreso += dt / cfg.duracion;
    spawnE -= dt; spawnM -= dt;
    if (spawnE <= 0) { crearEnemigo(); spawnE = cfg.spawnEnemigo * rnd(0.7, 1.3); }
    if (spawnM <= 0) { crearMeteoro(); spawnM = cfg.spawnMeteoro * rnd(0.7, 1.3); }
    if (progreso >= 1) {
      progreso = 1;
      if (cfg.jefe) crearJefe();
      else { base = { x: W / 2, y: -120, w: 260, h: 90 }; estado = "aterrizando"; }
    }
  }
  if (estado === "aterrizando") {
    base.y = Math.min(70, base.y + 90 * dt);
    spawnM -= dt;
    if (spawnM <= 0 && base.y < 40) { crearMeteoro(); spawnM = 1.2; }
    if (base.y >= 70) {
      for (const p of vivos()) {
        if (!p.aterrizado && Math.abs(p.x - base.x) < base.w / 2 && p.y < base.y + base.h + 20) { p.aterrizado = true; sfx.bonus(); }
      }
      if (vivos().length && vivos().every(p => p.aterrizado)) completarNivel();
    }
  }

  // Balas del jugador
  for (const b of balas) b.y -= 620 * dt;
  balas = balas.filter(b => b.y > -20);

  // Enemigos
  for (const e of enemigos) {
    e.y += cfg.velEnemigo * dt;
    e.fase += dt * 3;
    if (e.tipo === "zigzag") e.x = e.base + Math.sin(e.fase * 1.5) * 90;
    else if (e.tipo === "explorador") e.x = e.base + Math.sin(e.fase * 0.7) * 25;
    else {
      e.x = e.base + Math.sin(e.fase * 0.5) * 40;
      e.cool -= dt;
      const obj = objetivo(e.x, e.y);
      if (e.cool <= 0 && e.y > 0 && e.y < H - 200 && obj) { dispararEnemigo(e.x, e.y + 14, obj.x, obj.y, 200 + nivel * 8); e.cool = rnd(1.4, 2.4) - nivel * 0.05; }
    }
    for (const p of vivos()) if (e.vida > 0 && choque(e, p) && !p.aterrizado) { e.vida = 0; explosion(e.x, e.y); sfx.explosion(); dañarJugador(p); }
  }
  // Meteoros
  for (const m of meteoros) {
    m.x += m.vx * dt; m.y += m.vy * dt; m.rot += m.vrot * dt;
    if (m.x < m.r || m.x > W - m.r) m.vx *= -1;
    for (const p of vivos()) if (!m.muerto && !p.aterrizado && choque({ x: m.x, y: m.y, r: m.r * 0.85 }, p)) { m.muerto = true; explosion(m.x, m.y, 14, "#b9a28a"); dañarJugador(p); }
  }
  // Balas enemigas
  for (const b of balasEnemigas) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    for (const p of vivos()) if (!b.muerta && !p.aterrizado && choque(b, p)) { b.muerta = true; dañarJugador(p); }
  }
  if (jefe) actualizarJefe(dt);

  // Colisiones: balas del jugador
  for (const b of balas) {
    for (const e of enemigos) if (!b.muerta && e.vida > 0 && choque(b, e)) {
      b.muerta = true; e.vida--;
      if (e.vida <= 0) { sumar(b.dueño, e.tipo === "tirador" ? 200 : 100); explosion(e.x, e.y, 18); sfx.explosion(); soltarBonus(e.x, e.y); }
      else explosion(b.x, b.y, 4, "#fff", 80);
    }
    for (const m of meteoros) if (!b.muerta && !m.muerto && choque(b, { x: m.x, y: m.y, r: m.r })) {
      b.muerta = true; explosion(b.x, b.y, 3, "#cdb", 60);
      if (m.r > 24) m.r *= 0.9; // los grandes aguantan varios disparos
      else { m.muerto = true; sumar(b.dueño, 30); explosion(m.x, m.y, 12, "#b9a28a"); sfx.explosion(); }
    }
    if (jefe && !b.muerta && !jefe.entrando && choque(b, jefe)) {
      b.muerta = true; jefe.vida--; sumar(b.dueño, 10); explosion(b.x, b.y, 4, "#fff", 90);
      if (jefe.vida <= 0) { jefeDerrotado(b.dueño); break; }
    }
  }

  // Bonus
  for (const o of bonus) {
    o.y += 90 * dt;
    for (const p of vivos()) if (!o.cogido && choque(o, p)) {
      o.cogido = true; sfx.bonus(); p.puntos += 50;
      if (o.tipo === "escudo") p.escudo = 1;
      else if (o.tipo === "doble") p.doble = 12;
      else {
        const caido = jugadores.find(q => !q.vivo);
        if (caido) { caido.vivo = true; caido.vidas = 1; caido.invul = 2.5; caido.x = caido.spawnX; caido.y = H - 80; } // revive al compañero
        else p.vidas = Math.min(5, p.vidas + 1);
      }
    }
  }

  balas = balas.filter(b => !b.muerta);
  enemigos = enemigos.filter(e => e.vida > 0 && e.y < H + 40);
  meteoros = meteoros.filter(m => !m.muerto && m.y < H + 60);
  balasEnemigas = balasEnemigas.filter(b => !b.muerta && b.y < H + 20 && b.y > -20 && b.x > -20 && b.x < W + 20);
  bonus = bonus.filter(o => !o.cogido && o.y < H + 20);
  actualizarParticulas(dt);
}

function moverJugador(p, dt) {
  if (!p.vivo || p.aterrizado) { p.dx = 0; return; }
  let dx = (activo(p, "der") ? 1 : 0) - (activo(p, "izq") ? 1 : 0), dy = (activo(p, "abj") ? 1 : 0) - (activo(p, "arr") ? 1 : 0);
  if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
  p.dx = dx;
  p.x = Math.max(45, Math.min(W - 20, p.x + dx * p.vel * dt));
  const minY = estado === "aterrizando" ? 20 : 120;
  p.y = Math.max(minY, Math.min(H - 30, p.y + dy * p.vel * dt));
}
function actualizarParticulas(dt) {
  for (const p of particulas) { p.x += p.vx * dt; p.y += p.vy * dt; p.vida -= dt; }
  particulas = particulas.filter(p => p.vida > 0);
}
function actualizarJefe(dt) {
  const j = jefe;
  if (j.entrando) { j.y += 60 * dt; if (j.y >= 110) j.entrando = false; return; }
  j.fase += dt;
  j.x += j.dir * (j.gran ? 130 : 100) * dt;
  if (j.x > W - 80) j.dir = -1;
  if (j.x < 80) j.dir = 1;
  j.cool -= dt;
  const obj = objetivo(j.x, j.y);
  if (j.cool <= 0 && obj) {
    j.cool = j.gran ? 0.9 : 1.3;
    const n = j.gran ? 5 : 3;
    for (let i = 0; i < n; i++) {
      const a = Math.PI / 2 + (i - (n - 1) / 2) * 0.28;
      balasEnemigas.push({ x: j.x, y: j.y + j.r * 0.6, vx: Math.cos(a) * 230, vy: Math.sin(a) * 230, r: 6 });
    }
    if (j.gran && Math.random() < 0.4) dispararEnemigo(j.x, j.y, obj.x, obj.y, 280);
  }
  for (const p of vivos()) if (choque(j, p)) dañarJugador(p);
}
function jefeDerrotado(dueño) {
  sumar(dueño, jefe.gran ? 3000 : 1000);
  for (let i = 0; i < 6; i++) explosion(jefe.x + rnd(-40, 40), jefe.y + rnd(-30, 30), 30, i % 2 ? "#ffb347" : "#ff6a4d", 260);
  sfx.explosion(); balasEnemigas = [];
  jefe = null; base = { x: W / 2, y: -120, w: 260, h: 90 }; estado = "aterrizando";
}
function completarNivel() {
  ultimoBono = 0;
  for (const p of vivos()) { const b = 500 + p.vidas * 100; p.puntos += b; ultimoBono += b; }
  sfx.nivel();
  estado = "nivelCompleto"; temporizadorIntro = 4;
}

// ---------- Escena 3D ----------
// El juego usa coordenadas 2D (x, y); en 3D: x -> eje X, y -> eje Z (hacia abajo = hacia la cámara).
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("escena"), antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(W, H, false);
const escena = new THREE.Scene();
escena.fog = new THREE.Fog(0x070a1c, 650, 1250);
const camara = new THREE.PerspectiveCamera(50, W / H, 10, 3000);
escena.add(new THREE.AmbientLight(0x8890b0, 0.95));
const sol = new THREE.DirectionalLight(0xffffff, 1.15); sol.position.set(200, 500, 300); escena.add(sol);
const X3 = x => x - W / 2, Z3 = y => y - H / 2;
const mat = (c, em = 0x000000, ei = 0) => new THREE.MeshStandardMaterial({ color: c, emissive: em, emissiveIntensity: ei, roughness: 0.5, metalness: 0.3, flatShading: true });
const matBrillo = c => new THREE.MeshBasicMaterial({ color: c });

const GEO = {
  cuerpo: new THREE.ConeGeometry(11, 44, 4).rotateX(-Math.PI / 2),
  cuerpoEn: new THREE.ConeGeometry(12, 40, 4).rotateX(Math.PI / 2),
  ala: new THREE.BoxGeometry(42, 3, 18),
  cabina: new THREE.SphereGeometry(6, 12, 8),
  llama: new THREE.ConeGeometry(5, 20, 8).rotateX(Math.PI / 2),
  bala: new THREE.BoxGeometry(6, 6, 26),
  balaEn: new THREE.SphereGeometry(6, 10, 8),
  bonus: new THREE.OctahedronGeometry(14),
  caja: new THREE.BoxGeometry(1, 1, 1),
  jefe: new THREE.OctahedronGeometry(50),
};
const MAT_BALA = COLORES.map(c => matBrillo(c));
const MAT_BALA_EN = matBrillo(0xff6a4d);
const MAT_BONUS = { escudo: mat(0x4cc9f0, 0x4cc9f0, 0.8), doble: mat(0xffd166, 0xffd166, 0.8), vida: mat(0xef476f, 0xef476f, 0.8) };
const COL_ENEMIGO = { tirador: 0xc0392b, zigzag: 0x8e44ad, explorador: 0x27ae60 };

function crearMallaJugador(p) {
  const g = new THREE.Group();
  const c = new THREE.Color(p.color);
  const cuerpo = new THREE.Mesh(GEO.cuerpo, mat(c)); g.add(cuerpo);
  const ala = new THREE.Mesh(GEO.ala, mat(c.clone().multiplyScalar(0.7))); ala.position.set(0, -2, 12); g.add(ala);
  const cab = new THREE.Mesh(GEO.cabina, mat(0xffffff, 0xaaddff, 0.6)); cab.scale.set(0.9, 0.7, 1.5); cab.position.set(0, 6, 0); g.add(cab);
  const llama = new THREE.Mesh(GEO.llama, matBrillo(0xffa040)); llama.position.set(0, 0, 30); g.add(llama);
  const escudo = new THREE.Mesh(new THREE.SphereGeometry(32, 16, 12), new THREE.MeshBasicMaterial({ color: p.color, transparent: true, opacity: 0.25, wireframe: true }));
  escudo.visible = false; g.add(escudo);
  g.userData = { llama, escudo };
  g.scale.setScalar(1.45);
  return g;
}
function crearMallaEnemigo(e) {
  const g = new THREE.Group();
  const col = COL_ENEMIGO[e.tipo];
  g.add(new THREE.Mesh(GEO.cuerpoEn, mat(col)));
  const ala = new THREE.Mesh(GEO.ala, mat(new THREE.Color(col).multiplyScalar(0.7))); ala.position.set(0, -2, -10); ala.scale.set(1.1, 1, 1); g.add(ala);
  const ojo = new THREE.Mesh(GEO.cabina, mat(0xffe066, 0xffe066, 0.9)); ojo.position.set(0, 6, 4); g.add(ojo);
  g.scale.setScalar(e.tipo === "tirador" ? 1.65 : 1.45);
  return g;
}
function crearMallaMeteoro(m) {
  const geo = new THREE.IcosahedronGeometry(1, 1);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setXYZ(i, ...[pos.getX(i), pos.getY(i), pos.getZ(i)].map(v => v * rnd(0.78, 1.1)));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, mat(0x8a7664));
  mesh.userData.liberar = () => geo.dispose();
  return mesh;
}
function crearMallaBase() {
  const g = new THREE.Group();
  const placa = new THREE.Mesh(GEO.caja, mat(0x3a4a8a)); placa.scale.set(260, 30, 90); g.add(placa);
  const techo = new THREE.Mesh(GEO.caja, mat(0x56a0ff, 0x56a0ff, 0.4)); techo.scale.set(260, 4, 90); techo.position.y = 17; g.add(techo);
  const hangar = new THREE.Mesh(GEO.caja, mat(0x222233)); hangar.scale.set(120, 6, 40); hangar.position.set(0, 18, 20); g.add(hangar);
  const antena = new THREE.Mesh(GEO.caja, mat(0x8888aa)); antena.scale.set(8, 70, 8); antena.position.set(0, 50, -25); g.add(antena);
  const luz = new THREE.Mesh(new THREE.SphereGeometry(8, 10, 8), matBrillo(0xff5555)); luz.position.set(0, 90, -25); g.add(luz);
  const luces = [];
  for (let i = -3; i <= 3; i++) { const l = new THREE.Mesh(GEO.caja, mat(0xffe066, 0xffe066, 1)); l.scale.set(12, 4, 6); l.position.set(i * 36, 20, 38); g.add(l); luces.push(l); }
  g.userData = { luz, luces };
  return g;
}
function crearMallaJefe(j) {
  const g = new THREE.Group();
  const col = j.gran ? 0x7a1f3d : 0x5b3a8a;
  const cuerpo = new THREE.Mesh(GEO.jefe, mat(col)); cuerpo.scale.set(1.6, 0.45, 1.1); g.add(cuerpo);
  const ala = new THREE.Mesh(GEO.caja, mat(new THREE.Color(col).multiplyScalar(0.7))); ala.scale.set(150, 5, 40); ala.position.z = -20; g.add(ala);
  const nucleo = new THREE.Mesh(new THREE.SphereGeometry(16, 14, 10), mat(0xff4d4d, 0xff4d4d, 1)); nucleo.position.y = 14; g.add(nucleo);
  g.userData = { nucleo };
  g.scale.setScalar(j.r / 50);
  return g;
}

// Registro de objetos del juego que tienen malla 3D
let registro = [], marco = 0;
function malla(obj, crear) {
  obj._f = marco;
  if (!obj._m) { obj._m = crear(obj); escena.add(obj._m); registro.push(obj); }
  return obj._m;
}

// Estrellas de fondo
const NE = 400, posE = new Float32Array(NE * 3), velE = new Float32Array(NE);
for (let i = 0; i < NE; i++) { posE[i * 3] = rnd(-1000, 1000); posE[i * 3 + 1] = rnd(-320, -40); posE[i * 3 + 2] = rnd(-1300, 450); velE[i] = rnd(0.4, 1.6); }
const geoE = new THREE.BufferGeometry(); geoE.setAttribute("position", new THREE.BufferAttribute(posE, 3));
const estrellas3d = new THREE.Points(geoE, new THREE.PointsMaterial({ color: 0xffffff, size: 4, sizeAttenuation: false }));
estrellas3d.frustumCulled = false; escena.add(estrellas3d);

// Partículas
const MAXP = 800, pPos = new Float32Array(MAXP * 3), pCol = new Float32Array(MAXP * 3);
const geoP = new THREE.BufferGeometry();
geoP.setAttribute("position", new THREE.BufferAttribute(pPos, 3)); geoP.setAttribute("color", new THREE.BufferAttribute(pCol, 3));
const puntosP = new THREE.Points(geoP, new THREE.PointsMaterial({ size: 5, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
puntosP.frustumCulled = false; escena.add(puntosP);
const cacheColor = {};
const colorDe = c => cacheColor[c] || (cacheColor[c] = new THREE.Color(c));

const _v = new THREE.Vector3();
function proyectar(x, y, h = 0) { _v.set(X3(x), h, Z3(y)).project(camara); return { x: (_v.x + 1) / 2 * W, y: (1 - _v.y) / 2 * H }; }

function render3D(dt) {
  marco++;
  // cámara: sigue un poco a las naves y tiembla con los golpes
  const vs = estado === "menu" ? jugadores : (vivos().length ? vivos() : jugadores);
  const cx = vs.reduce((s, p) => s + p.x, 0) / vs.length - W / 2;
  const sh = sacudida > 0 ? 6 : 0;
  camara.position.set(cx * 0.18 + rnd(-sh, sh), 350 + rnd(-sh, sh), 470);
  camara.lookAt(cx * 0.1, 0, 30);
  const tono = (nivel - 1) * 28;
  escena.background = colorDe(`hsl(${230 + tono % 120}, 60%, 7%)`);
  escena.fog.color.copy(escena.background);

  // estrellas
  const avance = (estado === "jugando" || estado === "jefe" ? 150 : 50) * dt;
  for (let i = 0; i < NE; i++) { let z = posE[i * 3 + 2] + velE[i] * avance; if (z > 450) z = -1300; posE[i * 3 + 2] = z; }
  geoE.attributes.position.needsUpdate = true;

  // jugadores
  for (const p of jugadores) {
    const m = malla(p, crearMallaJugador);
    m.position.set(X3(p.x), 0, Z3(p.y));
    m.visible = p.vivo && !(p.invul > 0 && Math.floor(t * 14) % 2);
    m.rotation.z += ((-(p.dx || 0) * 0.45) - m.rotation.z) * Math.min(1, dt * 10);
    m.rotation.y = estado === "menu" ? t * 1.5 : 0;
    m.userData.llama.scale.set(1, 1, 0.8 + Math.random() * 0.6);
    m.userData.escudo.visible = p.escudo > 0;
  }
  for (const e of enemigos) {
    const m = malla(e, crearMallaEnemigo); m.position.set(X3(e.x), 0, Z3(e.y)); m.rotation.z = Math.sin(e.fase) * 0.3;
  }
  for (const o of meteoros) {
    const m = malla(o, crearMallaMeteoro); m.position.set(X3(o.x), 0, Z3(o.y)); m.scale.setScalar(o.r); m.rotation.set(o.rot, o.rot * 0.7, 0);
  }
  for (const b of balas) {
    const m = malla(b, () => new THREE.Mesh(GEO.bala, b.dueño ? MAT_BALA[b.dueño.id] : MAT_BALA[0])); m.position.set(X3(b.x), 0, Z3(b.y));
  }
  for (const b of balasEnemigas) {
    const m = malla(b, () => new THREE.Mesh(GEO.balaEn, MAT_BALA_EN)); m.position.set(X3(b.x), 0, Z3(b.y));
  }
  for (const o of bonus) {
    const m = malla(o, () => new THREE.Mesh(GEO.bonus, MAT_BONUS[o.tipo])); m.position.set(X3(o.x), 6, Z3(o.y)); m.rotation.y = t * 3;
  }
  if (base) {
    const m = malla(base, crearMallaBase); m.position.set(X3(base.x), 0, Z3(base.y + base.h / 2));
    m.userData.luz.visible = Math.sin(t * 6) > 0;
    m.userData.luces.forEach((l, i) => { l.material.emissiveIntensity = (Math.floor(t * 3) + i) % 2 ? 1 : 0.1; });
  }
  if (jefe) {
    const m = malla(jefe, crearMallaJefe); m.position.set(X3(jefe.x), 0, Z3(jefe.y)); m.rotation.z = Math.sin(t * 2) * 0.12;
    m.userData.nucleo.scale.setScalar(1 + Math.sin(t * 8) * 0.15);
  }
  // limpiar mallas de objetos que ya no existen
  registro = registro.filter(o => {
    if (o._f === marco) return true;
    escena.remove(o._m); if (o._m.userData.liberar) o._m.userData.liberar(); o._m = null; return false;
  });

  // partículas
  const n = Math.min(MAXP, particulas.length);
  for (let i = 0; i < n; i++) {
    const p = particulas[i], a = Math.max(0, p.vida / p.max), c = colorDe(p.color);
    pPos[i * 3] = X3(p.x); pPos[i * 3 + 1] = 6; pPos[i * 3 + 2] = Z3(p.y);
    pCol[i * 3] = c.r * a; pCol[i * 3 + 1] = c.g * a; pCol[i * 3 + 2] = c.b * a;
  }
  geoP.setDrawRange(0, n);
  geoP.attributes.position.needsUpdate = true; geoP.attributes.color.needsUpdate = true;

  renderer.render(escena, camara);
}

function dibujarBarraJefe(j) {
  ctx.fillStyle = "#0008"; ctx.fillRect(W / 2 - 150, 52, 300, 12);
  ctx.fillStyle = "#e74c3c"; ctx.fillRect(W / 2 - 150, 52, 300 * Math.max(0, j.vida / j.max), 12);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.strokeRect(W / 2 - 150, 52, 300, 12);
  texto(j.gran ? "COMANDANTE ZORG" : "GUARDIÁN", W / 2, 76, 14, "#ffd0d0");
}

function bloqueJugador(p, x, align) {
  const vidas = p.vivo ? "♥".repeat(Math.max(0, p.vidas)) : "FUERA";
  texto(`${p.nombre}  ${vidas}`, x, 11, 13, p.vivo ? p.color : "#889", align);
  let extra = `${p.puntos} pts`;
  if (p.escudo) extra += " · ESCUDO";
  if (p.doble > 0) extra += ` · x2 ${Math.ceil(p.doble)}s`;
  texto(extra, x, 27, 12, "#dfe9ff", align);
}
function dibujarHUD() {
  ctx.fillStyle = "#0007"; ctx.fillRect(0, 0, W, 38);
  texto(`Nivel ${nivel}/${TOTAL_NIVELES}`, W / 2, 11, 14, "#9bd");
  texto(`Total: ${totalPuntos()}`, W / 2, 27, 12, "#fff");
  bloqueJugador(jugadores[0], 12, "left");
  if (jugadores[1]) bloqueJugador(jugadores[1], W - 12, "right");
  // barra de progreso hacia la base
  const bx = 12, by = 48, bw = 14, bh = H - 74;
  ctx.fillStyle = "#0007"; ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = "#3d7bff"; ctx.fillRect(bx, by + bh * (1 - progreso), bw, bh * progreso);
  ctx.strokeStyle = "#9bd"; ctx.lineWidth = 1; ctx.strokeRect(bx, by, bw, bh);
  texto("BASE", bx + 7, by - 6, 9, "#9bd", "center", false);
  const py = by + bh * (1 - progreso);
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(bx + 20, py); ctx.lineTo(bx + 30, py - 5); ctx.lineTo(bx + 30, py + 5); ctx.fill();
}

function panel(titulo, lineas, sub) {
  ctx.fillStyle = "#050818d0"; ctx.fillRect(0, 0, W, H);
  texto(titulo, W / 2, 190, 48, "#ffd166");
  lineas.forEach((l, i) => texto(l, W / 2, 265 + i * 30, 20, "#dfe9ff"));
  if (sub) texto(sub, W / 2, 265 + lineas.length * 30 + 30, 20, Math.sin(t * 5) > -0.3 ? "#7CFC9A" : "#4a8");
}
function lineasPuntos() {
  if (jugadores.length === 1) return [];
  return jugadores.map(p => `${p.nombre}: ${p.puntos} puntos`);
}

function dibujarMenu() {
  texto("HALUSKI", W / 2, 90, 72, "#ffd166");
  texto("Misión a la Base", W / 2, 150, 34, "#9bd");
  ["Dispara a las naves enemigas,", "esquiva los meteoritos", `y llega a la base en ${TOTAL_NIVELES} niveles.`].forEach((l, i) => texto(l, W / 2, 360 + i * 26, 19, "#dfe9ff"));
  [1, 2].forEach(n => {
    const x = W / 2 + (n === 1 ? -120 : 120), sel = numJugadores === n;
    ctx.fillStyle = sel ? "#2b4bb0" : "#151c40"; ctx.fillRect(x - 100, 448, 200, 40);
    ctx.strokeStyle = sel ? "#ffd166" : "#3a4a94"; ctx.lineWidth = sel ? 3 : 1; ctx.strokeRect(x - 100, 448, 200, 40);
    texto(`${n} jugador${n === 2 ? "es (cooperativo)" : ""}`, x, 468, n === 2 ? 14 : 18, sel ? "#fff" : "#8fa3d9", "center", false);
  });
  texto("Pulsa 1 o 2 (o ← →) para elegir", W / 2, 505, 15, "#8fa3d9");
  texto("ENTER o ESPACIO para empezar", W / 2, 538, 22, Math.sin(t * 5) > -0.3 ? "#7CFC9A" : "#4a8");
  texto(`Récord: ${record}`, W / 2, 575, 16, "#ffd166");
}

function dibujar() {
  ctx.clearRect(0, 0, W, H);
  if (estado === "menu") { dibujarMenu(); return; }

  // etiquetas sobre los objetos 3D
  if (jugadores.length > 1) for (const p of jugadores) if (p.vivo) { const s = proyectar(p.x, p.y, 40); texto(`J${p.id + 1}`, s.x, s.y - 4, 12, p.color, "center", false); }
  for (const o of bonus) {
    const s = proyectar(o.x, o.y, 26);
    texto(o.tipo === "escudo" ? "ESCUDO" : o.tipo === "doble" ? "x2" : "♥", s.x, s.y, 12, "#fff");
  }
  if (base) { const s = proyectar(base.x, base.y + base.h / 2, 30); texto("BASE", s.x, s.y, 24, "#fff"); }

  dibujarHUD();
  if (jefe) dibujarBarraJefe(jefe);

  if (estado === "intro") {
    texto(`NIVEL ${nivel}`, W / 2, 230, 56, "#ffd166");
    texto(cfg.nombre, W / 2, 290, 30, "#fff");
    texto(cfg.jefe ? "¡Cuidado: un jefe te espera!" : (numJugadores === 2 ? "¡Llegad a la base!" : "¡Llega a la base!"), W / 2, 335, 20, "#9bd");
  } else if (estado === "aterrizando") {
    texto(base.y < 70 ? "¡La base se acerca!" : (numJugadores === 2 ? "¡Volad hasta la base los dos!" : "¡Vuela hasta la base!"), W / 2, 300, 26, "#7CFC9A");
  } else if (estado === "pausa") {
    panel("PAUSA", ["Pulsa P para continuar"], "");
  } else if (estado === "nivelCompleto") {
    const lineas = [numJugadores === 2 ? "Habéis llegado a la base." : "Has llegado a la base.", `Bonificación: +${ultimoBono} puntos`, ...lineasPuntos(), `Puntos totales: ${totalPuntos()}`];
    if (jugadores.some(p => !p.vivo)) lineas.push("Los compañeros caídos vuelven con 1 vida.");
    panel("¡NIVEL SUPERADO!", lineas, nivel >= TOTAL_NIVELES ? "Pulsa ENTER para continuar" : "Pulsa ENTER para el siguiente nivel");
  } else if (estado === "derrota") {
    panel("FIN DEL JUEGO", [numJugadores === 2 ? `Vuestra misión ha terminado en el nivel ${nivel}.` : `Haluski ha caído en el nivel ${nivel}.`, ...lineasPuntos(), `Puntos totales: ${totalPuntos()}`, `Récord: ${record}`], "Pulsa ENTER para volver al menú");
  } else if (estado === "victoria") {
    panel("¡VICTORIA!", [numJugadores === 2 ? "Habéis derrotado al Comandante Zorg" : "Haluski ha derrotado al Comandante Zorg", `y completado los ${TOTAL_NIVELES} niveles.`, ...lineasPuntos(), `Puntos finales: ${totalPuntos()}`, `Récord: ${record}`], "Pulsa ENTER para volver al menú");
  }
}

// ---------- Bucle ----------
let ultimo = performance.now();
function bucle(ahora) {
  const dt = Math.min(0.05, (ahora - ultimo) / 1000);
  ultimo = ahora;
  if (hit("KeyM")) sonido = !sonido;
  actualizar(dt);
  for (const k in pulsada) delete pulsada[k];
  render3D(dt);
  dibujar();
  requestAnimationFrame(bucle);
}
jugadores = crearJugadores(1); cfg = configNivel(1);
balas = []; enemigos = []; meteoros = []; balasEnemigas = []; particulas = []; bonus = [];
requestAnimationFrame(bucle);

// Gancho para pruebas
window.__haluski = {
  get estado() { return estado; },
  get jugadores() { return jugadores; },
  adelantar() { progreso = 0.999; },
  iniciar(n, nv = 1) { numJugadores = n; nivel = nv; jugadores = crearJugadores(n); empezarNivel(); estado = "jugando"; },
};
})();
</script>
</body>
