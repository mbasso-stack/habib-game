<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haluski: Misión Colonial</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; color: #dfe9ff; font-family: "Trebuchet MS", Verdana, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #caja { position: relative; aspect-ratio: 4 / 3; width: min(800px, 100vw, calc(84vh * 4 / 3)); border: 2px solid #2b3a7a; border-radius: 6px; box-shadow: 0 0 30px #1b2a7a88; overflow: hidden; background: #070a1c; }
  #caja canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #ayuda { margin-top: 8px; font-size: 14px; color: #8fa3d9; text-align: center; padding: 0 8px; line-height: 1.7; }
  kbd { background: #1a2350; border: 1px solid #3a4a94; border-radius: 4px; padding: 1px 6px; color: #fff; }
</style>
</head>
<body>
<div id="caja"><canvas id="escena" width="800" height="600"></canvas><canvas id="juego" width="800" height="600"></canvas></div>
<div id="ayuda">
  <b>1 jugador:</b> <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> o <kbd>WASD</kbd> mover · <kbd>Espacio</kbd> disparar<br>
  <b>2 jugadores:</b> J1 <kbd>WASD</kbd> + <kbd>Espacio</kbd> · J2 <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> + <kbd>Enter</kbd><br>
  <b>Ataque cargado:</b> mantén el disparo 2 s y suéltalo<br>
  <b>Armas especiales (si las compras):</b> <kbd>E</kbd> o <kbd>Shift</kbd> der. (J2) bomba de pulso<br>
  <kbd>P</kbd> pausa · <kbd>M</kbd> sonido
</div>
<script src="three.min.js"></script>
<script>
(() => {
"use strict";
const cv = document.getElementById("juego");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const TOTAL_NIVELES = 10;
const TRUCOS = new URLSearchParams(location.search).has("trucos"); // modo prueba: ?trucos
let nivelInicial = 1;

// ---------- Entrada ----------
const teclas = {};
const pulsada = {};
addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  if (!teclas[e.code]) pulsada[e.code] = true;
  teclas[e.code] = true;
  initAudio();
});
addEventListener("keyup", e => { teclas[e.code] = false; });
const hit = c => !!pulsada[c];

const MAPAS = {
  solo:    { izq: ["KeyA", "ArrowLeft"], der: ["KeyD", "ArrowRight"], arr: ["KeyW", "ArrowUp"], abj: ["KeyS", "ArrowDown"], disp: ["Space"], sec: ["KeyE", "ShiftLeft"] },
  wasd:    { izq: ["KeyA"], der: ["KeyD"], arr: ["KeyW"], abj: ["KeyS"], disp: ["Space"], sec: ["KeyE"] },
  flechas: { izq: ["ArrowLeft"], der: ["ArrowRight"], arr: ["ArrowUp"], abj: ["ArrowDown"], disp: ["Enter"], sec: ["ShiftRight", "Slash"] },
};
const activo = (p, a) => p.mapa[a].some(c => teclas[c]);

// ---------- Sonido ----------
let actx = null, sonido = true;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
}
function beep(f1, f2, dur, tipo = "square", vol = 0.06) {
  if (!actx || !sonido) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = tipo;
  o.frequency.setValueAtTime(f1, actx.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), actx.currentTime + dur);
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}
const sfx = {
  disparo: () => beep(900, 300, 0.1, "square", 0.03),
  moneda: () => beep(1200, 1900, 0.08, "triangle", 0.05),
  pico: () => beep(260, 110, 0.09, "square", 0.06),
  carga: () => beep(500, 1500, 0.25, "triangle", 0.07),
  rayo: () => { beep(150, 40, 0.5, "sawtooth", 0.1); beep(900, 100, 0.4, "square", 0.05); },
  explosion: () => beep(220, 40, 0.3, "sawtooth", 0.07),
  golpe: () => beep(300, 60, 0.35, "sawtooth", 0.09),
  bonus: () => { beep(500, 900, 0.12, "triangle", 0.08); setTimeout(() => beep(900, 1400, 0.12, "triangle", 0.08), 90); },
  nivel: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, f, 0.18, "triangle", 0.08), i * 120)),
  derrota: () => [400, 300, 200, 100].forEach((f, i) => setTimeout(() => beep(f, f * 0.7, 0.25, "sawtooth", 0.08), i * 160)),
};

// ---------- Utilidades ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const choque = (a, b) => Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r;
function texto(t, x, y, tam, color = "#fff", align = "center", sombra = true) {
  ctx.font = `bold ${tam}px "Trebuchet MS", Verdana, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = "middle";
  if (sombra) { ctx.fillStyle = "#000a"; ctx.fillText(t, x + 2, y + 2); }
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}

// ---------- Niveles ----------
function configNivel(n) {
  const k = numJugadores === 2 ? 0.8 : 1; // con dos naves aparece más enemigo
  return {
    nombre: ["Órbita Terrestre","Cinturón Lunar","Nube de Polvo","Campo de Asteroides","Tormenta Solar",
             "Nebulosa Carmesí","Zona Hostil","Cementerio Estelar","Agujero Negro","La Base Final"][n - 1],
    duracion: 28 + n * 4,
    spawnEnemigo: Math.max(0.55, 1.6 - n * 0.1) * k,
    spawnMeteoro: Math.max(0.35, 1.3 - n * 0.09) * k,
    velEnemigo: 70 + n * 9,
    velMeteoro: 110 + n * 14,
    probTirador: Math.min(0.75, 0.1 + n * 0.07),
    probZigzag: n >= 3 ? Math.min(0.5, 0.1 + (n - 3) * 0.06) : 0,
    jefe: n === 5 || n === 10,
  };
}

// ---------- Estado ----------
let estado = "menu"; // menu, intro, jugando, pausa, jefe, aterrizando, colonizando, tienda, ataque, derrota, victoria
let estadoPrevio = "jugando";
let numJugadores = 1;
let nivel = 1, cfg, t = 0, progreso = 0, record = 0;
try { record = +localStorage.getItem("haluski_record") || 0; } catch (e) {}
let jugadores = [], balas, enemigos, meteoros, balasEnemigas, particulas, bonus, base, jefe;
let temporizadorIntro = 0, spawnE = 0, spawnM = 0, sacudida = 0, ultimoBono = 0;
let armas = { triple: false, misiles: false, pulso: false }, mejoras = { motores: 0, cadencia: 0, blindaje: 0, deposito: 0, iman: 0, carga: 0, reparador: 0, pico: 0, bateria: 0, botas: 0 };
let drenaje = 0, combustible = 6, misiles = [], ondas = [], cdPulso = 0, tiendaTab = 0;
const cargaT = () => [2, 1.6, 1.3, 1.0][mejoras.carga];
const maxComb = () => 6 + 4 * mejoras.deposito, maxVidas = () => 5 + mejoras.blindaje, CADENCIA = [0.2, 0.17, 0.14, 0.11];
const CINE_A = 3.2, CINE_B = 3.6, CINE_C = 2.2, CINE_T = CINE_A + CINE_B + CINE_C;
let cine = 0, exp = null, rocas = [], combustibles = [], cineAterrizo = false;
let rayos = [], monedas = 0, monedasSuelo = [], colonias = [], tiendaSel = 0, ataqueLineas = [], tiendaMsg = "", tiendaMsgT = 0, bonusColonias = 0;
const COSTES = [15, 30, 50], NOMBRES_PROT = ["Escudo orbital", "Torretas láser", "Fortaleza total"];

const NOMBRES = ["Haluski", "Jugador 2"];
const COLORES = ["#4cc9f0", "#ff9f43"];

function crearJugadores(n) {
  return Array.from({ length: n }, (_, i) => ({
    id: i, nombre: NOMBRES[i], color: COLORES[i],
    mapa: n === 1 ? MAPAS.solo : (i === 0 ? MAPAS.wasd : MAPAS.flechas),
    spawnX: n === 1 ? W / 2 : W / 2 + (i === 0 ? -90 : 90),
    x: 0, y: H - 80, r: 16, vel: 300, vidas: 3, escudo: 0, invul: 0, cool: 0, doble: 0,
    vivo: true, puntos: 0, aterrizado: false, carga: 0, cdM: 0,
  }));
}
const vivos = () => jugadores.filter(p => p.vivo);
const totalPuntos = () => jugadores.reduce((s, p) => s + p.puntos, 0);
function sumar(p, n) { if (p) p.puntos += n; else jugadores[0].puntos += n; }
function guardarRecord() {
  if (TRUCOS) return;
  const total = totalPuntos();
  if (total > record) { record = total; try { localStorage.setItem("haluski_record", record); } catch (e) {} }
}
function objetivo(x, y) {
  let mejor = null, d = Infinity;
  for (const p of vivos()) { const dd = Math.hypot(p.x - x, p.y - y); if (dd < d) { d = dd; mejor = p; } }
  return mejor;
}

function prepararMenu() {
  jugadores = crearJugadores(numJugadores);
  jugadores.forEach((p, i) => { p.x = W / 2 + (numJugadores === 1 ? 0 : (i ? 60 : -60)); p.y = 235; p.invul = 0; });
  balas = []; enemigos = []; meteoros = []; balasEnemigas = []; particulas = []; bonus = []; base = null; jefe = null; nivel = 1; progreso = 0; rayos = [];
}
function iniciarJuego() {
  monedas = 0; colonias = []; bonusColonias = 0; combustible = 6; drenaje = 0;
  armas = { triple: false, misiles: false, pulso: false }; mejoras = { motores: 0, cadencia: 0, blindaje: 0, deposito: 0, iman: 0, carga: 0, reparador: 0, pico: 0, bateria: 0, botas: 0 };
  nivel = TRUCOS ? nivelInicial : 1; jugadores = crearJugadores(numJugadores);
  if (TRUCOS) armas = { triple: true, misiles: true, pulso: true };
  empezarNivel();
}
function empezarNivel() {
  cfg = configNivel(nivel);
  balas = []; enemigos = []; meteoros = []; balasEnemigas = []; particulas = []; bonus = [];
  base = null; jefe = null; progreso = 0; spawnE = 1; spawnM = 0.5; monedasSuelo = []; rayos = []; misiles = []; ondas = []; cdPulso = 0;
  for (const p of jugadores) p.carga = 0;
  for (const p of jugadores) {
    if (!p.vivo) { p.vivo = true; p.vidas = 1; } // los caídos vuelven con 1 vida
    p.x = p.spawnX; p.y = H - 80; p.invul = 2; p.cool = 0; p.aterrizado = false;
  }
  if (nivel > 1 && mejoras.reparador) for (const p of jugadores) p.vidas = Math.min(maxVidas(), p.vidas + mejoras.reparador);
  temporizadorIntro = 2.6; estado = "intro";
}

// ---------- Efectos ----------
function explosion(x, y, n = 16, color = "#ffb347", vel = 180) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.283), v = rnd(30, vel);
    particulas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vida: rnd(0.3, 0.8), max: 0.8, color, tam: rnd(1.5, 4) });
  }
}

// ---------- Creación ----------
function crearEnemigo() {
  const r = Math.random();
  let tipo = "explorador";
  if (r < cfg.probZigzag) tipo = "zigzag";
  else if (r < cfg.probZigzag + cfg.probTirador) tipo = "tirador";
  const e = { tipo, x: rnd(40, W - 40), y: -30, r: 18, vida: 1, base: 0, fase: rnd(0, 6.28), cool: rnd(0.8, 2) };
  e.base = e.x;
  if (tipo === "tirador") { e.vida = 2 + (nivel > 6 ? 1 : 0); e.r = 20; }
  enemigos.push(e);
}
function crearMeteoro() {
  const r = rnd(16, 34);
  meteoros.push({ tex: rint(0, 2), x: rnd(r, W - r), y: -r, r, vx: rnd(-40, 40), vy: cfg.velMeteoro * rnd(0.8, 1.3), rot: rnd(0, 6), vrot: rnd(-2, 2),
    forma: Array.from({ length: 9 }, () => rnd(0.75, 1.1)) });
}
function crearJefe() {
  const gran = nivel === 10;
  const vida = Math.round((gran ? 60 : 25) * (numJugadores === 2 ? 1.6 : 1));
  jefe = { x: W / 2, y: -80, r: gran ? 55 : 42, vida, max: vida, dir: 1, cool: 1.5, fase: 0, entrando: true, gran };
  estado = "jefe";
}
function soltarBonus(x, y) {
  if (Math.random() > 0.17) return;
  const todosLlenos = vivos().every(p => p.vidas >= maxVidas()) && vivos().length === jugadores.length;
  const tipos = todosLlenos ? ["escudo", "doble"] : ["escudo", "doble", "vida"];
  bonus.push({ x, y, r: 13, tipo: tipos[rint(0, tipos.length - 1)] });
}
function matarEnemigo(e, dueño) {
  sumar(dueño, e.tipo === "tirador" ? 200 : 100); explosion(e.x, e.y, 18); sfx.explosion(); soltarBonus(e.x, e.y); soltarMonedas(e);
}
function lanzarMisiles(p) {
  for (const sg of [-1, 1]) misiles.push({ x: p.x + sg * 14, y: p.y - 10, vx: sg * 90, vy: -260, r: 6, dueño: p });
}
function actualizarMisiles(dt) {
  for (const m of misiles) {
    let tgt = null, d = 1e9;
    for (const e of enemigos) if (e.vida > 0 && e.y < m.y) { const dd = Math.hypot(e.x - m.x, e.y - m.y); if (dd < d) { d = dd; tgt = e; } }
    if (jefe && !jefe.entrando) { const dd = Math.hypot(jefe.x - m.x, jefe.y - m.y); if (dd < d) { d = dd; tgt = jefe; } }
    let ax = 0, ay = -1;
    if (tgt) { const L = Math.hypot(tgt.x - m.x, tgt.y - m.y) || 1; ax = (tgt.x - m.x) / L; ay = (tgt.y - m.y) / L; }
    m.vx += ax * 900 * dt; m.vy += ay * 900 * dt;
    const v = Math.hypot(m.vx, m.vy) || 1; if (v > 420) { m.vx *= 420 / v; m.vy *= 420 / v; }
    m.x += m.vx * dt; m.y += m.vy * dt;
    for (const e of enemigos) if (!m.muerto && e.vida > 0 && choque(m, e)) { m.muerto = true; e.vida -= 3; explosion(m.x, m.y, 14, "#ffb347"); if (e.vida <= 0) matarEnemigo(e, m.dueño); }
    for (const q of meteoros) if (!m.muerto && !q.muerto && choque(m, { x: q.x, y: q.y, r: q.r })) { m.muerto = true; q.muerto = true; sumar(m.dueño, 40); explosion(q.x, q.y, 14, "#b9a28a"); sfx.explosion(); }
    if (jefe && !m.muerto && !jefe.entrando && choque(m, jefe)) { m.muerto = true; jefe.vida -= 3; sumar(m.dueño, 30); explosion(m.x, m.y, 10, "#ffb347"); if (jefe.vida <= 0) jefeDerrotado(m.dueño); }
    if (m.y < -40 || m.x < -40 || m.x > W + 40 || m.y > H + 40) m.muerto = true;
  }
  misiles = misiles.filter(m => !m.muerto);
}
function lanzarPulso(p) {
  ondas.push({ x: p.x, y: p.y, rad: 10 });
  sfx.rayo(); sacudida = 0.3;
  for (const e of enemigos) if (e.vida > 0) { e.vida -= 3; explosion(e.x, e.y, 8, "#8fe0ff"); if (e.vida <= 0) matarEnemigo(e, p); }
  for (const m of meteoros) if (!m.muerto) { m.muerto = true; sumar(p, 30); explosion(m.x, m.y, 10, "#b9a28a"); }
  balasEnemigas.forEach(b => { b.muerta = true; });
  if (jefe && !jefe.entrando) { jefe.vida -= 8; sumar(p, 80); explosion(jefe.x, jefe.y, 24, "#8fe0ff", 240); if (jefe.vida <= 0) jefeDerrotado(p); }
}
function lanzarRayo(p) {
  rayos.push({ x: p.x, y: p.y - 30, r: 34, dueño: p, golpeados: new Set() });
  sfx.rayo(); sacudida = Math.max(sacudida, 0.15);
}
function soltarMonedas(e) {
  const n = e.tipo === "tirador" ? 3 : e.tipo === "zigzag" ? rint(1, 2) : (Math.random() < 0.7 ? 1 : 0);
  for (let i = 0; i < n; i++) monedasSuelo.push({ x: e.x + rnd(-14, 14), y: e.y + rnd(-10, 10), r: 10, vx: rnd(-30, 30), vy: rnd(60, 110) });
}
function dispararEnemigo(x, y, tx, ty, vel = 220) {
  const a = Math.atan2(ty - y, tx - x);
  balasEnemigas.push({ x, y, vx: Math.cos(a) * vel, vy: Math.sin(a) * vel, r: 5 });
}

// ---------- Daño ----------
function dañarJugador(p) {
  if (p.invul > 0 || !p.vivo || p.aterrizado) return;
  if (TRUCOS) { p.invul = 1; explosion(p.x, p.y, 10, "#6cf"); sfx.golpe(); return; }
  if (p.escudo > 0) { p.escudo = 0; p.invul = 1; sfx.golpe(); explosion(p.x, p.y, 10, "#6cf"); return; }
  p.vidas--; sacudida = 0.4; sfx.golpe();
  explosion(p.x, p.y, 24, "#ff6a4d");
  p.doble = 0; p.carga = 0;
  if (p.vidas <= 0) {
    p.vivo = false;
    if (!vivos().length) { estado = "derrota"; sfx.derrota(); guardarRecord(); }
  } else { p.invul = 2.2; p.x = p.spawnX; p.y = H - 80; }
}

// ---------- Actualización ----------
function actualizar(dt) {
  t += dt;
  const enAccion = estado === "jugando" || estado === "jefe";
  if (sacudida > 0) sacudida -= dt;
  if (TRUCOS) {
    monedas = 99999; combustible = maxComb();
    if (hit("KeyN") && estado === "jugando") progreso = 1; // salta al final del nivel
  }

  if (estado === "menu") {
    const antes = numJugadores;
    if (hit("Digit1") || hit("Numpad1") || hit("ArrowLeft")) numJugadores = 1;
    if (hit("Digit2") || hit("Numpad2") || hit("ArrowRight")) numJugadores = 2;
    if (numJugadores !== antes) prepararMenu();
    if (TRUCOS) { if (hit("ArrowUp")) nivelInicial = Math.min(TOTAL_NIVELES, nivelInicial + 1); if (hit("ArrowDown")) nivelInicial = Math.max(1, nivelInicial - 1); }
    if (hit("Enter") || hit("Space")) iniciarJuego();
    return;
  }
  if (estado === "derrota" || estado === "victoria") { if (hit("Enter")) { estado = "menu"; prepararMenu(); } return; }
  if (estado === "pausa") { if (hit("KeyP")) estado = estadoPrevio; return; }
  if (estado === "cinematica") {
    cine += dt; actualizarParticulas(dt);
    if (cine >= CINE_A + CINE_B && !cineAterrizo) { cineAterrizo = true; sacudida = 0.35; sfx.explosion(); for (const p of jugadores) explosion(p.spawnX, H - 100, 26, "#d8c8a8", 230); }
    if (cine >= CINE_T || hit("Enter")) iniciarExploracion();
    return;
  }
  if (estado === "exploracion") {
    if (hit("KeyP")) { estadoPrevio = estado; estado = "pausa"; return; }
    exp.tiempo -= dt; if (exp.msgT > 0) exp.msgT -= dt;
    for (const p of vivos()) {
      moverJugador(p, dt);
      p.cool -= dt; if (p.golpe > 0) p.golpe -= dt;
      if (activo(p, "disp") && p.cool <= 0) {
        p.cool = 0.45; p.golpe = 0.25; sfx.pico();
        let mejor = null, d = 1e9;
        for (const o of rocas) { const dd = Math.hypot(o.x - p.x, o.y - p.y) - o.r; if (dd < d) { d = dd; mejor = o; } }
        if (mejor && d < 40) golpearRoca(mejor, p);
      }
    }
    for (const o of rocas) if (o.sac > 0) o.sac -= dt;
    for (const c of combustibles) {
      c.t += dt;
      const cerca = objetivo(c.x, c.y);
      if (cerca && combustible < maxComb()) { const d = Math.hypot(cerca.x - c.x, cerca.y - c.y) || 1; if (d < 90) { c.x += (cerca.x - c.x) / d * 200 * dt; c.y += (cerca.y - c.y) / d * 200 * dt; } }
      for (const p of vivos()) if (!c.cogido && Math.hypot(p.x - c.x, p.y - c.y) < 28) {
        if (combustible < maxComb()) { combustible++; c.cogido = true; sfx.moneda(); }
        else { exp.msg = "¡Depósito lleno!"; exp.msgT = 1.5; }
      }
    }
    combustibles = combustibles.filter(c => !c.cogido);
    actualizarParticulas(dt);
    if (exp.tiempo <= 0 || hit("KeyR")) terminarExploracion();
    return;
  }
  if (tiendaMsgT > 0) tiendaMsgT -= dt;
  if (estado === "colonizando") {
    temporizadorIntro -= dt; actualizarParticulas(dt);
    if (temporizadorIntro <= 0 || hit("Enter")) {
      if (nivel >= TOTAL_NIVELES) finalizarVictoria();
      else { tiendaSel = colonias.length - 1; estado = "tienda"; }
    }
    return;
  }
  if (estado === "tienda") {
    let its = itemsTienda();
    if (hit("ArrowLeft") || hit("KeyA")) { tiendaTab = (tiendaTab + 3) % 4; tiendaSel = 0; its = itemsTienda(); }
    if (hit("ArrowRight") || hit("KeyD")) { tiendaTab = (tiendaTab + 1) % 4; tiendaSel = 0; its = itemsTienda(); }
    const n = Math.max(1, its.length);
    if (hit("ArrowUp") || hit("KeyW")) tiendaSel = (tiendaSel + n - 1) % n;
    if (hit("ArrowDown") || hit("KeyS")) tiendaSel = (tiendaSel + 1) % n;
    tiendaSel = Math.min(tiendaSel, n - 1);
    if (hit("Enter") && its[tiendaSel]) comprarItem(its[tiendaSel]);
    if (hit("Space")) {
      ataqueLineas = resolverAtaque(nivel + 1);
      if (ataqueLineas.length) estado = "ataque"; else { nivel++; empezarNivel(); }
    }
    return;
  }
  if (estado === "ataque") { if (hit("Enter") || hit("Space")) { nivel++; empezarNivel(); } return; }
  if (estado === "intro") {
    temporizadorIntro -= dt;
    if (temporizadorIntro <= 0) estado = "jugando";
    for (const p of jugadores) moverJugador(p, dt);
    actualizarParticulas(dt);
    return;
  }
  if (hit("KeyP")) { estadoPrevio = estado; estado = "pausa"; return; }

  for (const p of jugadores) {
    moverJugador(p, dt);
    // Disparo
    p.cool -= dt;
    const puedeDisparar = p.vivo && !p.aterrizado && estado !== "aterrizando";
    const pulsando = puedeDisparar && activo(p, "disp");
    if (pulsando) {
      const antes = p.carga; p.carga += dt;
      if (antes < cargaT() && p.carga >= cargaT()) sfx.carga();
    } else {
      if (puedeDisparar && p.carga >= cargaT()) lanzarRayo(p); // al soltar con la carga completa: ataque cargado
      p.carga = 0;
    }
    if (pulsando && p.carga < cargaT() && p.cool <= 0) {
      p.cool = CADENCIA[mejoras.cadencia];
      if (p.doble > 0) balas.push({ x: p.x - 10, y: p.y - 14, r: 3, dueño: p }, { x: p.x + 10, y: p.y - 14, r: 3, dueño: p });
      else balas.push({ x: p.x, y: p.y - 18, r: 3, dueño: p });
      if (armas.triple) balas.push({ x: p.x - 8, y: p.y - 12, vx: -120, r: 3, dueño: p }, { x: p.x + 8, y: p.y - 12, vx: 120, r: 3, dueño: p });
      if (armas.misiles && p.cdM <= 0 && combustible >= 1) { combustible--; p.cdM = 1.2; lanzarMisiles(p); }
      sfx.disparo();
    }
    p.cdM -= dt;
    if (armas.pulso && puedeDisparar && activo(p, "sec") && cdPulso <= 0 && combustible >= 3) { combustible -= 3; cdPulso = 8; lanzarPulso(p); }
    if (p.doble > 0) p.doble -= dt;
    if (p.invul > 0) p.invul -= dt;
  }

  if (cdPulso > 0) cdPulso -= dt;
  drenaje += dt; // el depósito se va gastando mientras vuelas
  if (drenaje >= 20) { drenaje -= 20; if (combustible > 0) combustible--; }

  // Avance del nivel
  if (estado === "jugando") {
    progreso += dt / cfg.duracion;
    spawnE -= dt; spawnM -= dt;
    if (spawnE <= 0) { crearEnemigo(); spawnE = cfg.spawnEnemigo * rnd(0.7, 1.3); }
    if (spawnM <= 0) { crearMeteoro(); spawnM = cfg.spawnMeteoro * rnd(0.7, 1.3); }
    if (progreso >= 1) {
      progreso = 1;
      if (cfg.jefe) crearJefe();
      else { base = { x: W / 2, y: -120, w: 260, h: 90 }; estado = "aterrizando"; }
    }
  }
  if (estado === "aterrizando") {
    base.y = Math.min(70, base.y + 90 * dt);
    spawnM -= dt;
    if (spawnM <= 0 && base.y < 40) { crearMeteoro(); spawnM = 1.2; }
    if (base.y >= 70) {
      for (const p of vivos()) {
        if (!p.aterrizado && Math.abs(p.x - base.x) < base.w / 2 && p.y < base.y + base.h + 20) { p.aterrizado = true; sfx.bonus(); }
      }
      if (vivos().length && vivos().every(p => p.aterrizado)) completarNivel();
    }
  }

  // Balas del jugador
  for (const b of balas) { b.y -= 620 * dt; b.x += (b.vx || 0) * dt; }
  balas = balas.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20);

  // Rayos cargados: atraviesan enemigos, meteoritos y disparos enemigos
  for (const r of rayos) {
    r.y -= 520 * dt;
    for (const e of enemigos) if (e.vida > 0 && !r.golpeados.has(e) && choque(r, e)) { r.golpeados.add(e); e.vida = 0; matarEnemigo(e, r.dueño); }
    for (const m of meteoros) if (!m.muerto && choque(r, { x: m.x, y: m.y, r: m.r })) { m.muerto = true; sumar(r.dueño, 50); explosion(m.x, m.y, 14, "#b9a28a"); sfx.explosion(); }
    for (const b of balasEnemigas) if (!b.muerta && choque(r, b)) b.muerta = true;
    if (jefe && !jefe.entrando && !r.golpeados.has(jefe) && choque(r, jefe)) {
      r.golpeados.add(jefe); jefe.vida -= 12; sumar(r.dueño, 120); explosion(jefe.x, jefe.y + 20, 20, "#fff", 200);
      if (jefe.vida <= 0) jefeDerrotado(r.dueño);
    }
  }
  rayos = rayos.filter(r => r.y > -90);
  actualizarMisiles(dt);
  for (const o of ondas) o.rad += 900 * dt;
  ondas = ondas.filter(o => o.rad < 700);

  // Enemigos
  for (const e of enemigos) {
    e.y += cfg.velEnemigo * dt;
    e.fase += dt * 3;
    if (e.tipo === "zigzag") e.x = e.base + Math.sin(e.fase * 1.5) * 90;
    else if (e.tipo === "explorador") e.x = e.base + Math.sin(e.fase * 0.7) * 25;
    else {
      e.x = e.base + Math.sin(e.fase * 0.5) * 40;
      e.cool -= dt;
      const obj = objetivo(e.x, e.y);
      if (e.cool <= 0 && e.y > 0 && e.y < H - 200 && obj) { dispararEnemigo(e.x, e.y + 14, obj.x, obj.y, 200 + nivel * 8); e.cool = rnd(1.4, 2.4) - nivel * 0.05; }
    }
    for (const p of vivos()) if (e.vida > 0 && choque(e, p) && !p.aterrizado) { e.vida = 0; explosion(e.x, e.y); sfx.explosion(); dañarJugador(p); }
  }
  // Meteoros
  for (const m of meteoros) {
    m.x += m.vx * dt; m.y += m.vy * dt; m.rot += m.vrot * dt;
    if (m.x < m.r || m.x > W - m.r) m.vx *= -1;
    for (const p of vivos()) if (!m.muerto && !p.aterrizado && choque({ x: m.x, y: m.y, r: m.r * 0.85 }, p)) { m.muerto = true; explosion(m.x, m.y, 14, "#b9a28a"); dañarJugador(p); }
  }
  // Balas enemigas
  for (const b of balasEnemigas) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    for (const p of vivos()) if (!b.muerta && !p.aterrizado && choque(b, p)) { b.muerta = true; dañarJugador(p); }
  }
  if (jefe) actualizarJefe(dt);

  // Colisiones: balas del jugador
  for (const b of balas) {
    for (const e of enemigos) if (!b.muerta && e.vida > 0 && choque(b, e)) {
      b.muerta = true; e.vida--;
      if (e.vida <= 0) { sumar(b.dueño, e.tipo === "tirador" ? 200 : 100); explosion(e.x, e.y, 18); sfx.explosion(); soltarBonus(e.x, e.y); soltarMonedas(e); }
      else explosion(b.x, b.y, 4, "#fff", 80);
    }
    for (const m of meteoros) if (!b.muerta && !m.muerto && choque(b, { x: m.x, y: m.y, r: m.r })) {
      b.muerta = true; explosion(b.x, b.y, 3, "#cdb", 60);
      if (m.r > 24) m.r *= 0.9; // los grandes aguantan varios disparos
      else { m.muerto = true; sumar(b.dueño, 30); explosion(m.x, m.y, 12, "#b9a28a"); sfx.explosion(); }
    }
    if (jefe && !b.muerta && !jefe.entrando && choque(b, jefe)) {
      b.muerta = true; jefe.vida--; sumar(b.dueño, 10); explosion(b.x, b.y, 4, "#fff", 90);
      if (jefe.vida <= 0) { jefeDerrotado(b.dueño); break; }
    }
  }

  // Bonus
  for (const o of bonus) {
    o.y += 90 * dt;
    for (const p of vivos()) if (!o.cogido && choque(o, p)) {
      o.cogido = true; sfx.bonus(); p.puntos += 50;
      if (o.tipo === "escudo") p.escudo = 1;
      else if (o.tipo === "doble") p.doble = 12;
      else {
        const caido = jugadores.find(q => !q.vivo);
        if (caido) { caido.vivo = true; caido.vidas = 1; caido.invul = 2.5; caido.x = caido.spawnX; caido.y = H - 80; } // revive al compañero
        else p.vidas = Math.min(maxVidas(), p.vidas + 1);
      }
    }
  }

  for (const c of monedasSuelo) {
    c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= 0.98;
    const obj = objetivo(c.x, c.y);
    if (obj) { const d = Math.hypot(obj.x - c.x, obj.y - c.y) || 1; if (d < 110 + 70 * mejoras.iman) { c.x += (obj.x - c.x) / d * 220 * dt; c.y += (obj.y - c.y) / d * 220 * dt; } }
    for (const p of vivos()) if (!c.cogida && choque(c, p)) { c.cogida = true; monedas++; sfx.moneda(); }
  }
  monedasSuelo = monedasSuelo.filter(c => !c.cogida && c.y < H + 20);
  balas = balas.filter(b => !b.muerta);
  enemigos = enemigos.filter(e => e.vida > 0 && e.y < H + 40);
  meteoros = meteoros.filter(m => !m.muerto && m.y < H + 60);
  balasEnemigas = balasEnemigas.filter(b => !b.muerta && b.y < H + 20 && b.y > -20 && b.x > -20 && b.x < W + 20);
  bonus = bonus.filter(o => !o.cogido && o.y < H + 20);
  actualizarParticulas(dt);
}

function moverJugador(p, dt) {
  if (!p.vivo || p.aterrizado) { p.dx = 0; p.dy = 0; return; }
  let dx = (activo(p, "der") ? 1 : 0) - (activo(p, "izq") ? 1 : 0), dy = (activo(p, "abj") ? 1 : 0) - (activo(p, "arr") ? 1 : 0);
  if (dx && dy) { dx *= 0.7071; dy *= 0.7071; }
  p.dx = dx; p.dy = dy;
  const vel = estado === "exploracion" ? p.vel * (1 + 0.25 * mejoras.botas) : p.vel * (1 + 0.12 * mejoras.motores) * (combustible <= 0 ? 0.6 : 1);
  p.x = Math.max(45, Math.min(W - 20, p.x + dx * vel * dt));
  const minY = estado === "aterrizando" ? 20 : 120;
  p.y = Math.max(minY, Math.min(H - 30, p.y + dy * vel * dt));
}
function actualizarParticulas(dt) {
  for (const p of particulas) { p.x += p.vx * dt; p.y += p.vy * dt; p.vida -= dt; }
  particulas = particulas.filter(p => p.vida > 0);
}
function actualizarJefe(dt) {
  const j = jefe;
  if (j.entrando) { j.y += 60 * dt; if (j.y >= 110) j.entrando = false; return; }
  j.fase += dt;
  j.x += j.dir * (j.gran ? 130 : 100) * dt;
  if (j.x > W - 80) j.dir = -1;
  if (j.x < 80) j.dir = 1;
  j.cool -= dt;
  const obj = objetivo(j.x, j.y);
  if (j.cool <= 0 && obj) {
    j.cool = j.gran ? 0.9 : 1.3;
    const n = j.gran ? 5 : 3;
    for (let i = 0; i < n; i++) {
      const a = Math.PI / 2 + (i - (n - 1) / 2) * 0.28;
      balasEnemigas.push({ x: j.x, y: j.y + j.r * 0.6, vx: Math.cos(a) * 230, vy: Math.sin(a) * 230, r: 6 });
    }
    if (j.gran && Math.random() < 0.4) dispararEnemigo(j.x, j.y, obj.x, obj.y, 280);
  }
  for (const p of vivos()) if (choque(j, p)) dañarJugador(p);
}
function jefeDerrotado(dueño) {
  sumar(dueño, jefe.gran ? 3000 : 1000);
  for (let i = 0; i < (jefe.gran ? 40 : 25); i++) monedasSuelo.push({ x: jefe.x + rnd(-60, 60), y: jefe.y + rnd(-30, 30), r: 10, vx: rnd(-80, 80), vy: rnd(40, 120) });
  for (let i = 0; i < 6; i++) explosion(jefe.x + rnd(-40, 40), jefe.y + rnd(-30, 30), 30, i % 2 ? "#ffb347" : "#ff6a4d", 260);
  sfx.explosion(); balasEnemigas = [];
  jefe = null; base = { x: W / 2, y: -120, w: 260, h: 90 }; estado = "aterrizando";
}
function completarNivel() {
  ultimoBono = 0;
  for (const p of vivos()) { const b = 500 + p.vidas * 100; p.puntos += b; ultimoBono += b; }
  monedas += monedasSuelo.length; monedasSuelo = [];
  colonias.push({ idx: nivel - 1, nombre: PLANETAS[nivel - 1].n, prot: 0 });
  enemigos = []; meteoros = []; balasEnemigas = []; balas = []; rayos = []; misiles = []; bonus = []; ondas = [];
  for (const p of jugadores) { p.x = p.spawnX; p.y = H - 150; p.carga = 0; }
  prepararSuperficie(nivel - 1);
  sfx.nivel(); estado = "cinematica"; cine = 0; cineAterrizo = false;
}
function iniciarExploracion() {
  const n = 11 + Math.floor(nivel / 2), v = (nivel - 1) % 3, vida = 2 + Math.floor(nivel / 4);
  rocas = []; combustibles = []; particulas = [];
  for (let intentos = 0; rocas.length < n && intentos < 500; intentos++) {
    const r = rnd(22, 34), x = rnd(70, W - 40), y = rnd(150, 440);
    if (rocas.some(o => Math.hypot(o.x - x, o.y - y) < o.r + r + 25)) continue;
    rocas.push({ x, y, r, vida, max: vida, tex: v, sac: 0 });
  }
  const tmax = 45 + 10 * mejoras.bateria;
  exp = { tiempo: tmax, max: tmax, msg: "", msgT: 0 };
  for (const p of jugadores) { p.aterrizado = false; p.cool = 0; p.golpe = 0; p.x = p.spawnX; p.y = H - 150; }
  estado = "exploracion";
}
function golpearRoca(o, p) {
  o.vida -= 1 + mejoras.pico; o.sac = 0.2;
  explosion(o.x, o.y, 6, "#c8b8a0", 120);
  if (o.vida <= 0) {
    explosion(o.x, o.y, 22, "#ffb347", 200); sfx.explosion();
    for (let i = rint(1, 2); i > 0; i--) combustibles.push({ x: o.x + rnd(-18, 18), y: o.y + rnd(-14, 14), t: rnd(0, 6) });
    rocas.splice(rocas.indexOf(o), 1); p.puntos += 20;
  }
}
function terminarExploracion() {
  rocas = []; combustibles = []; exp = null; particulas = [];
  if (nivel >= TOTAL_NIVELES) finalizarVictoria();
  else { tiendaTab = 0; tiendaSel = Math.max(0, colonias.length - 1); estado = "tienda"; }
}
function finalizarVictoria() {
  bonusColonias = colonias.reduce((s, c) => s + 1000 + 500 * c.prot, 0);
  const parte = Math.floor(bonusColonias / jugadores.length);
  for (const p of jugadores) p.puntos += parte;
  estado = "victoria"; guardarRecord();
}
function itemsTienda() {
  if (tiendaTab === 0) return colonias.map(c => ({ nombre: c.nombre, nivel: c.prot, max: 3, costes: COSTES, desc: NOMBRES_PROT[c.prot] || "", aplicar: () => { c.prot++; } }));
  if (tiendaTab === 3) return [
    { nombre: "Pico reforzado", nivel: mejoras.pico, max: 2, costes: [25, 50], desc: "Rompe las rocas más rápido", aplicar: () => { mejoras.pico++; } },
    { nombre: "Batería del traje", nivel: mejoras.bateria, max: 3, costes: [20, 35, 55], desc: "+10 s de exploración", aplicar: () => { mejoras.bateria++; } },
    { nombre: "Botas propulsoras", nivel: mejoras.botas, max: 2, costes: [20, 40], desc: "El astronauta corre más", aplicar: () => { mejoras.botas++; } },
  ];
  if (tiendaTab === 1) return [

    { nombre: "Bomba de pulso", nivel: armas.pulso ? 1 : 0, max: 1, costes: [100], desc: "Tecla E / Shift der. · 3 comb.", aplicar: () => { armas.pulso = true; } },
  ];
  return [
    { nombre: "Motores", nivel: mejoras.motores, max: 3, costes: [20, 40, 70], desc: "+12% de velocidad", aplicar: () => { mejoras.motores++; } },
    { nombre: "Cadencia", nivel: mejoras.cadencia, max: 3, costes: [25, 45, 75], desc: "Dispara más rápido", aplicar: () => { mejoras.cadencia++; } },
    { nombre: "Blindaje", nivel: mejoras.blindaje, max: 3, costes: [30, 50, 80], desc: "+1 vida y vida máxima", aplicar: () => { mejoras.blindaje++; for (const p of jugadores) p.vidas = Math.min(maxVidas(), p.vidas + 1); } },
    { nombre: "Depósito", nivel: mejoras.deposito, max: 3, costes: [20, 35, 60], desc: "Más combustible", aplicar: () => { mejoras.deposito++; } },
    { nombre: "Carga rápida", nivel: mejoras.carga, max: 3, costes: [30, 50, 80], desc: "El ataque cargado tarda menos", aplicar: () => { mejoras.carga++; } },
    { nombre: "Reparador", nivel: mejoras.reparador, max: 2, costes: [50, 90], desc: "+1 vida al empezar cada nivel", aplicar: () => { mejoras.reparador++; } },
    { nombre: "Imán de monedas", nivel: mejoras.iman, max: 3, costes: [20, 35, 55], desc: "Atrae monedas desde más lejos", aplicar: () => { mejoras.iman++; } },
  ].slice(0, 7).filter(Boolean);
}
function comprarItem(it) {
  if (it.nivel >= it.max) return;
  const coste = it.costes[it.nivel];
  if (monedas < coste) { tiendaMsg = "No tienes suficientes monedas."; tiendaMsgT = 2; return; }
  monedas -= coste; it.aplicar(); sfx.bonus();
}
function mejorarColonia(c) {
  if (c.prot >= 3) return;
  if (monedas < COSTES[c.prot]) { tiendaMsg = "No tienes suficientes monedas."; tiendaMsgT = 2; return; }
  monedas -= COSTES[c.prot]; c.prot++; sfx.bonus();
}
function resolverAtaque(n) {
  if (n < 3 || !colonias.length) return [];
  const poderMax = Math.min(3, 1 + Math.floor(n / 3));
  const blanco = colonias.filter(() => Math.random() < 0.5);
  if (!blanco.length) blanco.push(colonias[rint(0, colonias.length - 1)]);
  const lineas = [];
  for (const c of blanco) {
    const poder = rint(1, poderMax);
    if (c.prot >= poder) lineas.push({ t: `${c.nombre}: la defensa resistió el ataque (fuerza ${poder}).`, c: "#7CFC9A" });
    else { lineas.push({ t: `${c.nombre}: ¡colonia destruida! (fuerza ${poder}, protección ${c.prot})`, c: "#ff7a7a" }); c.destruida = true; }
  }
  colonias = colonias.filter(c => !c.destruida);
  return lineas;
}

function formaGeo(pts, grosor = 2) {
  const s = new THREE.Shape(); pts.forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y));

  return g;
}

function renderEspacio(dt, ev) {
  escena.fog.near = 650; escena.fog.far = 1250;
  // cámara: sigue un poco a las naves y tiembla con los golpes
  const vs = estado === "menu" ? jugadores : (vivos().length ? vivos() : jugadores);
  const cx = vs.reduce((s, p) => s + p.x, 0) / vs.length - W / 2;
  const sh = sacudida > 0 ? 6 : 0;
  const camN = new THREE.Vector3(cx * 0.18, 350, 470), lkN = new THREE.Vector3(cx * 0.1, 0, 30);
  if (ev === "cinematica" && base) { // la cámara se lanza hacia el planeta
    const u = Math.min(1, cine / CINE_A), e = u * u * (3 - 2 * u);
    camN.lerp(new THREE.Vector3(0, 70, -10), e); lkN.lerp(new THREE.Vector3(0, -R_PLANETA - 8, Z3(base.y + base.h / 2)), e);
  }
  camara.position.set(camN.x + rnd(-sh, sh), camN.y + rnd(-sh, sh), camN.z);
  camara.lookAt(lkN);
  const tono = (nivel - 1) * 28;
  escena.background = colorDe(`hsl(${230 + tono % 120}, 60%, 7%)`);
  escena.fog.color.copy(escena.background);

  // estrellas
  const avance = (estado === "jugando" || estado === "jefe" ? 150 : 50) * dt;
  for (let i = 0; i < NE; i++) { let z = posE[i * 3 + 2] + velE[i] * avance; if (z > 450) z = -1300; posE[i * 3 + 2] = z; }
  geoE.attributes.position.needsUpdate = true;

  // jugadores
  for (const p of jugadores) {
    const m = malla(p, crearMallaJugador);
    m.position.set(X3(p.x), 0, Z3(p.y));
    const dv = ev === "cinematica" ? Math.min(1, cine / CINE_A) : 0, de = dv * dv * (3 - 2 * dv);
    m.position.y = -de * 180; m.scale.setScalar(1.35 * (1 - 0.75 * de));
    m.visible = p.vivo && !(p.invul > 0 && Math.floor(t * 14) % 2);
    m.rotation.z += ((-(p.dx || 0) * 0.45) - m.rotation.z) * Math.min(1, dt * 10);
    m.rotation.y = estado === "menu" ? t * 1.5 : 0;
    m.userData.llamas.forEach(l => l.scale.set(1, 1, 0.8 + Math.random() * 0.6));
    m.userData.escudo.visible = p.escudo > 0;
    const c = Math.min(1, (p.carga || 0) / cargaT()), cm = m.userData.carga;
    cm.visible = c > 0.1 && p.vivo;

function renderSuperficie(dt, ev) {
  escena.background = skyColor; escena.fog.color.copy(skyColor); escena.fog.near = 600; escena.fog.far = 1700;
  const sh = sacudida > 0 ? 5 : 0, vs = vivos().length ? vivos() : jugadores;

  const camJ = new THREE.Vector3(cx * 0.18, SY + 350, 470), lkJ = new THREE.Vector3(cx * 0.1, SY, 30);
  const ncz = Z3(H - 100);
  const camB = a => new THREE.Vector3(Math.sin(a) * 330, SY + 110, ncz + Math.cos(a) * 340);
  let cp = camJ, lk = lkJ, alt = 0, esc = 1;
  if (ev === "cinematica") {
    const c = cine - CINE_A;
    if (c < CINE_B) {
      const ub = c / CINE_B, e = 1 - Math.pow(1 - ub, 2);
      alt = 450 * (1 - e); esc = 0;
      cp = camB(-0.7 + 0.9 * ub); cp.y += 120 * (1 - ub);

  // naves aparcadas (o aterrizando)
  for (const p of jugadores) {
    const m = malla(p, crearMallaJugador);
    m.position.set(X3(p.spawnX), SY + 8 + alt, Z3(H - 100)); m.rotation.set(0, 0, 0); m.scale.setScalar(1.35);
    m.visible = p.vivo;

    m.userData.escudo.visible = false; m.userData.carga.visible = false;
  }
  // astronautas
  for (const p of vivos()) {
    p.astr = p.astr || {};
    const m = malla(p.astr, () => crearMallaAstronauta(p));
    m.position.set(X3(p.x), SY, Z3(p.y)); m.scale.setScalar(0.7 * esc); m.visible = esc > 0.01;
    const mov = Math.abs(p.dx || 0) + Math.abs(p.dy || 0) > 0 && ev === "exploracion";
    if (mov) m.rotation.y += ang(m.rotation.y, Math.atan2(p.dx, p.dy)) * Math.min(1, dt * 12);
    const paso = mov ? Math.sin(t * 12) * 0.7 : 0;
    m.userData.piernas[0].rotation.x = paso; m.userData.piernas[1].rotation.x = -paso;
    const sw = p.golpe > 0 ? 1 - p.golpe / 0.25 : -1;
    m.userData.brazo.rotation.x = sw >= 0 ? -0.3 - Math.sin(sw * Math.PI) * 1.9 : -0.3 + (mov ? -paso * 0.4 : 0);

}

    panel("FIN DEL JUEGO", [numJugadores === 2 ? `Vuestra misión ha terminado en el nivel ${nivel}.` : `Haluski ha caído en el nivel ${nivel}.`, ...lineasPuntos(), `Colonias fundadas: ${colonias.length}`, `Puntos totales: ${totalPuntos()}`, `Récord: ${record}`], "Pulsa ENTER para volver al menú");
  } else if (estado === "victoria") {
    panel("¡VICTORIA!", [numJugadores === 2 ? "Habéis derrotado al Comandante Zorg" : "Haluski ha derrotado al Comandante Zorg", `y colonizado ${TOTAL_NIVELES} planetas.`, `Colonias a salvo: ${colonias.length} (bonus +${bonusColonias})`, ...lineasPuntos(), `Puntos finales: ${totalPuntos()}`, `Récord: ${record}`], "Pulsa ENTER para volver al menú");
  }
}

// ---------- Bucle ----------
let ultimo = performance.now();
function bucle(ahora) {
  const dt = Math.min(0.05, (ahora - ultimo) / 1000);
  ultimo = ahora;
  if (hit("KeyM")) sonido = !sonido;
  actualizar(dt);
  for (const k in pulsada) delete pulsada[k];
  render3D(dt);
  dibujar();
  requestAnimationFrame(bucle);
}
cfg = configNivel(1); prepararMenu();
requestAnimationFrame(bucle);

// Gancho para pruebas
window.__haluski = {
  get estado() { return estado; },
  get jugadores() { return jugadores; },
  adelantar() { progreso = 0.999; },
  get rayos() { return rayos; }, irTienda() { tiendaTab = 0; tiendaSel = 0; estado = "tienda"; }, get cine() { return cine; }, get rocas() { return rocas; }, get comb() { return combustible; }, completar() { completarNivel(); }, get armas() { return armas; }, get mejoras() { return mejoras; }, get combustible() { return combustible; }, set combustible(v) { combustible = v; },
  get monedas() { return monedas; }, get colonias() { return colonias; }, dar(n) { monedas += n; },
  iniciar(n, nv = 1) { numJugadores = n; nivel = nv; jugadores = crearJugadores(n); empezarNivel(); estado = "jugando"; },
};
})();
</script>
