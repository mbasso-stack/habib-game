<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haluski: Misión Colonial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --cian: #4fd0ff; --oro: #ffd166; --rojo: #ff5a4a; --verde: #7CFC9A; --fondo: rgba(6, 12, 26, 0.86); --borde: rgba(79, 208, 255, 0.45); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #e6f4ff; font-family: Rajdhani, "Segoe UI", Arial, sans-serif; font-size: 17px; }
#lienzo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
h1, h2, h3, h4, .boton, kbd, .marca, #aviso b { font-family: Orbitron, Arial, sans-serif; letter-spacing: 0.06em; }
#fundido { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.35s; z-index: 50; }
#golpe { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.25s; box-shadow: inset 0 0 160px 40px rgba(255, 40, 40, 0.9); z-index: 5; }
#video { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; object-fit: contain; display: none; z-index: 60; }
#saltarVideo { position: fixed; right: 24px; bottom: 20px; z-index: 61; display: none; padding: 8px 14px; border: 1px solid var(--borde); background: rgba(0,0,0,.6); cursor: pointer; font-family: Orbitron, sans-serif; font-size: 13px; }
#fps { position: fixed; left: 8px; bottom: 6px; font: 12px monospace; color: #9fe; z-index: 8; display: none; }

/* HUD */
#hud.oculto { display: none; }
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
.caja-hud { position: absolute; background: var(--fondo); border: 1px solid var(--borde); padding: 10px 14px; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px)); }
#hIzq { left: 16px; top: 16px; width: 260px; }
#hDer { right: 16px; top: 16px; text-align: right; min-width: 210px; }
#hDer div { font-size: 16px; } #hDer b { color: var(--oro); font-family: Orbitron, sans-serif; font-size: 18px; }
.etq { font-size: 12px; letter-spacing: .12em; color: #8fb8d8; text-transform: uppercase; display: flex; justify-content: space-between; margin-top: 4px; }
.barra { height: 9px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); margin: 2px 0 4px; }
.barra i { display: block; height: 100%; transition: width .2s; box-shadow: 0 0 8px currentColor; }
#objetivo { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font-family: Orbitron, sans-serif; font-size: 13px; color: var(--cian); background: var(--fondo); border: 1px solid var(--borde); padding: 6px 16px; white-space: nowrap; }
.vuelo-solo { display: none; } #hud.vuelo .vuelo-solo { display: block; }
#mira { position: absolute; left: 50%; top: 50%; width: 34px; height: 34px; margin: -17px; border: 2px solid rgba(79,208,255,.75); border-radius: 50%; }
#mira::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; background: var(--cian); border-radius: 50%; }
#hArmas { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 8px; }
.slot { position: relative; min-width: 120px; padding: 6px 10px 9px; background: var(--fondo); border: 1px solid var(--borde); font-size: 14px; }
.slot b { font-family: Orbitron, sans-serif; color: var(--oro); margin-right: 6px; } .slot.sel { border-color: var(--oro); box-shadow: 0 0 14px rgba(255,209,102,.5); }
.slot i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--cian); }
#hVelCaja { left: 16px; bottom: 18px; width: 200px; }
#cargaPlasma { position: absolute; left: 50%; top: calc(50% + 36px); width: 160px; height: 6px; margin-left: -80px; background: rgba(255,255,255,.1); display: none; }
#cargaPlasma i { display: block; height: 100%; background: #b46bff; box-shadow: 0 0 10px #b46bff; }
#barraJefe { position: absolute; left: 50%; top: 52px; width: 420px; margin-left: -210px; text-align: center; display: none; font-family: Orbitron, sans-serif; font-size: 13px; color: #ffd0d0; }
#barraJefe .barra { height: 12px; } #barraJefe i { background: var(--rojo); }
#marcadores { position: absolute; inset: 0; }
.marca { position: absolute; transform: translate(-50%, -50%); font-size: 12px; text-align: center; color: var(--cian); white-space: nowrap; text-shadow: 0 0 6px #000; }
.marca::before { content: ""; display: block; width: 12px; height: 12px; margin: 0 auto 3px; border: 2px solid currentColor; transform: rotate(45deg); }
.marca small { display: block; color: #cfe; font-family: Rajdhani, sans-serif; font-size: 13px; }
.marca.estacion { color: var(--verde); } .marca.conquistado { color: var(--oro); } .marca.jefe { color: var(--rojo); }
.marca.enemigo { color: var(--rojo); } .marca.enemigo::before { width: 22px; height: 22px; transform: none; border-radius: 3px; border-width: 2px; }
.marca.fuera { opacity: .75; } .marca.enemigo.fuera::before { width: 10px; height: 10px; transform: rotate(45deg); }
#aviso { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); z-index: 6; display: none; background: var(--fondo); border: 1px solid var(--oro); padding: 10px 20px; font-size: 19px; pointer-events: none; }
#aviso b { color: #111; background: var(--oro); padding: 1px 8px; margin-right: 6px; }
#toasts { position: fixed; right: 16px; top: 150px; width: 360px; z-index: 7; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast { background: var(--fondo); border-left: 3px solid var(--cian); padding: 8px 12px; font-size: 16px; transition: opacity .5s, transform .5s; }
.toast.oro { border-color: var(--oro); } .toast.rojo { border-color: var(--rojo); } .toast.fuera { opacity: 0; transform: translateX(30px); }

/* Paneles */
#panel { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(0, 4, 12, 0.55); backdrop-filter: blur(3px); }
#panel .caja { width: min(1060px, 94vw); max-height: 90vh; overflow: auto; background: linear-gradient(160deg, rgba(10,22,44,.96), rgba(4,10,22,.96)); border: 1px solid var(--borde); padding: 18px 22px; box-shadow: 0 0 40px rgba(79,208,255,.15); clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px)); }
#panel.pausa .caja, #panel.principal .caja, #panel.creditos .caja { width: auto; background: none; border: none; box-shadow: none; clip-path: none; }
#panel.principal { background: linear-gradient(90deg, rgba(0,4,12,.85), rgba(0,4,12,.1)); justify-content: flex-start; padding-left: 7vw; }
.cab { display: flex; align-items: flex-start; gap: 16px; border-bottom: 1px solid var(--borde); padding-bottom: 8px; }
.cab h2 { margin: 0; color: var(--cian); font-size: 26px; } .cab p { margin: 2px 0 0; color: #9bb8cf; }
.quien { margin-left: auto; font-family: Orbitron, sans-serif; font-size: 12px; color: var(--oro); padding: 6px 10px; border: 1px solid rgba(255,209,102,.4); }
.x { background: none; border: 1px solid var(--borde); color: #fff; width: 34px; height: 34px; cursor: pointer; font-size: 16px; }
.cab .quien + .x, .cab div + .x { margin-left: 8px; } .cab > div:first-child + .x { margin-left: auto; }
.saldo { display: flex; gap: 22px; margin: 10px 0; font-size: 17px; } .oro { color: var(--oro); }
.boton { display: inline-block; background: linear-gradient(180deg, rgba(79,208,255,.25), rgba(79,208,255,.08)); border: 1px solid var(--cian); color: #fff; padding: 9px 18px; cursor: pointer; font-size: 13px; text-decoration: none; text-transform: uppercase; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); transition: background .15s; }
.boton:hover:not([disabled]) { background: rgba(79,208,255,.45); } .boton[disabled] { opacity: .35; cursor: not-allowed; }
.boton.grande { font-size: 15px; padding: 12px 26px; } .boton.peq { padding: 6px 12px; font-size: 11px; } .boton.sec { border-color: #8a97a8; background: rgba(255,255,255,.06); }
.dos { display: grid; grid-template-columns: 300px 1fr; gap: 18px; margin-top: 10px; }
.lista { display: flex; flex-direction: column; gap: 5px; }
.fila { display: flex; justify-content: space-between; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); color: #dfefff; padding: 8px 10px; cursor: pointer; font-family: inherit; font-size: 15px; }
.fila.sel { border-color: var(--oro); background: rgba(255,209,102,.1); } .fila span { color: var(--oro); }
.detalle h3 { margin: 0 0 8px; font-size: 22px; color: var(--oro); } .detalle h4, .carta h4 { margin: 14px 0 6px; color: var(--cian); font-size: 14px; }
.stats > div { display: grid; grid-template-columns: 120px 1fr 50px; align-items: center; gap: 8px; } .stats .grande { font-family: Orbitron; color: var(--oro); }
.mejora { display: grid; grid-template-columns: 1fr 140px 120px; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
.mejora small { display: block; color: #9bb8cf; } .ok { color: var(--verde); font-family: Orbitron; font-size: 11px; }
.pip { display: inline-block; width: 16px; height: 8px; margin-right: 4px; background: rgba(255,255,255,.12); transform: skewX(-20deg); } .pip.on { background: var(--cian); box-shadow: 0 0 6px var(--cian); }
.colores { display: flex; gap: 8px; margin: 6px 0; } .color { width: 30px; height: 30px; border: 2px solid rgba(255,255,255,.3); cursor: pointer; } .color.sel { border-color: #fff; box-shadow: 0 0 10px #fff; }
.huecos { display: flex; flex-wrap: wrap; gap: 8px; }
select, input[type=text], #nombreClan { background: #0b1830; color: #fff; border: 1px solid var(--borde); padding: 6px 8px; font-family: inherit; font-size: 15px; }
.pestanas { display: flex; gap: 6px; margin: 6px 0 12px; } .pestanas button { background: none; border: 1px solid rgba(255,255,255,.2); color: #cfe; padding: 7px 14px; cursor: pointer; font-family: Orbitron, sans-serif; font-size: 12px; }
.pestanas button.sel { border-color: var(--oro); color: var(--oro); }
.rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.carta { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); padding: 10px 12px; } .carta p { margin: 4px 0 8px; color: #b8cfe2; } .carta h4 { margin-top: 0; }
.carta.ancha { grid-column: 1 / -1; } .carta .barra { width: 220px; display: inline-block; vertical-align: middle; margin: 0 8px; }
.menuCentro { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.menuCentro h2 { font-size: 40px; color: var(--cian); margin: 0 0 8px; }
.principal h1 { font-size: 78px; margin: 0; color: #fff; text-shadow: 0 0 24px rgba(79,208,255,.8); font-weight: 900; }
.principal h3 { margin: -6px 0 20px; color: var(--oro); letter-spacing: .4em; }
.principal .boton { min-width: 280px; text-align: left; } .nota { color: #8fb8d8; max-width: 380px; font-size: 14px; }
.ajustes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 30px; margin: 14px 0; } .ajustes label { display: flex; flex-direction: column; gap: 4px; color: #cfe; }
.ajustes .chk { flex-direction: row; align-items: center; gap: 8px; } .ajustes h4 { grid-column: 1 / -1; color: var(--cian); margin: 8px 0 0; }
.skins { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; } .skins button { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.2); color: #fff; padding: 8px 12px; cursor: pointer; font-family: inherit; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.skins button.sel { border-color: var(--oro); } .skins span { width: 14px; height: 14px; display: inline-block; }
input[type=range] { accent-color: var(--cian); }
kbd { background: #13254a; border: 1px solid var(--borde); padding: 1px 6px; font-size: 11px; }
.ctrls p { line-height: 2; }
.creditos { text-align: center; max-width: 640px; } .creditos h1 { color: var(--oro); font-size: 46px; } .creditos h3 { color: var(--cian); margin-top: 30px; } .creditos p b { color: var(--oro); }
.rodillo { animation: subir 30s linear; } @keyframes subir { from { transform: translateY(60vh); } to { transform: translateY(0); } }
#panel.vestuario { background: none; backdrop-filter: none; align-items: flex-end; padding-bottom: 3vh; pointer-events: none; }
#panel.vestuario .caja { width: auto; background: none; border: none; box-shadow: none; clip-path: none; pointer-events: auto; overflow: visible; }
.vest { text-align: center; } .vest h2 { color: var(--cian); letter-spacing: .3em; margin: 0 0 10px; text-shadow: 0 0 12px #000; }
.vestNav { display: flex; align-items: center; justify-content: center; gap: 22px; } .vestNav > div { width: min(480px, 70vw); background: var(--fondo); border: 1px solid var(--borde); padding: 10px 18px; }
.vestNav h3 { margin: 0; color: var(--oro); font-size: 26px; } .rol { color: var(--cian); margin: 2px 0 6px; font-weight: 700; }
.flecha { font-size: 26px; width: 58px; height: 58px; background: var(--fondo); border: 1px solid var(--cian); color: #fff; cursor: pointer; }
.puntos span { display: inline-block; width: 10px; height: 10px; margin: 10px 5px; border: 1px solid var(--cian); transform: rotate(45deg); } .puntos span.on { background: var(--cian); }
@media (max-width: 800px) { .dos { grid-template-columns: 1fr; } .ajustes { grid-template-columns: 1fr; } #hIzq { width: 200px; } }
</style>
</head>
<body>
<canvas id="lienzo"></canvas>
<div id="hud" class="oculto">
  <div id="objetivo">Objetivo: <span id="hObjetivo"></span></div>
  <div id="hIzq" class="caja-hud">
    <div class="vuelo-solo"><div class="etq"><span>Casco de la nave</span><span id="tVida"></span></div><div class="barra"><i id="bVida"></i></div></div>
    <div class="etq"><span>Comida</span><span id="tComida"></span></div><div class="barra"><i id="bComida"></i></div>
  </div>
  <div id="hDer" class="caja-hud">
    <div><b id="hMonedas">0</b> monedas</div>
    <div>Carga <span id="hCarga"></span></div>
    <div>Derrotados <span id="hDerrotas"></span> · Planetas <span id="hPlanetas"></span></div>
  </div>
  <div class="vuelo-solo"><div id="mira"></div><div id="cargaPlasma"><i></i></div><div id="hArmas"></div>
    <div id="hVelCaja" class="caja-hud"><div class="etq"><span>Velocidad</span><span id="hVel"></span></div><div class="barra"><i id="bVel"></i></div></div>
    <div id="barraJefe"><span id="nJefe"></span><div class="barra"><i></i></div></div>
    <div id="marcadores"></div>
  </div>
</div>
<div id="aviso"></div>
<div id="toasts"></div>
<div id="golpe"></div>
<div id="panel"></div>
<div id="fundido"></div>
<div id="fps"></div>
<video id="video" playsinline preload="auto"></video><div id="saltarVideo">ENTER o clic para saltar ▸</div>

<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="js/datos.js?v=3"></script>
<script src="js/motor.js?v=3"></script>
<script src="js/personajes.js?v=3"></script>
<script src="js/modelos.js?v=3"></script>
<script src="js/ui.js?v=3"></script>
<script src="js/estacion.js?v=3"></script>
<script src="js/espacio.js?v=3"></script>
<script src="js/planeta.js?v=3"></script>
<script src="js/vestuario.js?v=3"></script>
<script src="js/juego.js?v=3"></script>
</body>
</html>
